<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Fallboard Piano</title>
<link rel="license" href="credits.html">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<!-- the library's covers: Boska, Melodrama and Switzer from Fontshare (ITF Free Font License); Nyght Serif (SIL OFL, dist/fonts/nyght) is declared below -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@500,501,900,901&f[]=melodrama@500,700&f[]=switzer@100,200,400&display=swap">
<style>
  /* Nyght Serif by Maksym Kobuzan, SIL Open Font License 1.1 (fonts/nyght/OFL.txt): the covers' outlined
     words and numerals, and their echoed titles */
  @font-face { font-family: "Nyght Serif"; src: url("fonts/nyght/NyghtSerif-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Nyght Serif"; src: url("fonts/nyght/NyghtSerif-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Nyght Serif"; src: url("fonts/nyght/NyghtSerif-BoldItalic.woff2") format("woff2"); font-weight: 700; font-style: italic; font-display: swap; }
  @font-face { font-family: "Nyght Serif"; src: url("fonts/nyght/NyghtSerif-DarkItalic.woff2") format("woff2"); font-weight: 900; font-style: italic; font-display: swap; }
  /* Layout: the music fills the page down to the keys. What you are looking at (the piece, roll
     or score) floats over the top of it as glass; how it plays back (which hands, step and play,
     how fast) sits under the keys on the black page. Colour is kept for meaning: one hue per hand,
     red for "now"; everything else is white or grey. The controls are the Graph Notes glass
     material; the keyboard and the music are matte.

     Every length, size, duration and fade below comes from these tokens. One edge (16 px) sets
     the margin on every side; controls are 44 px; gaps are 8 px. */
  :root {
    /* the page and its greys: text, secondary text, a light wash and its dark twin */
    --bg: #000000;
    --t1: #f5f5f7;
    --t2: #a1a1a8;
    --fill: rgb(255 255 255 / 0.15);
    --fill-ink: rgb(0 0 0 / 0.15);
    --focus: #0a84ff;
    --brass: #d9b15c;
    --brass-lo: #9c7a2c;
    --blue: #5b9df5;
    --blue-lo: #2f6bc4;
    --felt: #8f1a25;
    --now: #f0475a;
    --key-a: #fbf8f0;
    --key-b: #ebe5d7;
    --key-c: #cfc7b4;
    --key-ink: #6f6858;
    --ebony-a: #3b3b41;
    --ebony-b: #1a1a1d;
    --ebony-c: #0a0a0b;
    --glass-fill: rgb(76 76 76 / 42%);
    --glass-filter: blur(8px) saturate(150%) brightness(1.08);
    --glass-lighting-brightness: 1;

    /* the music */
    --stage: #0b0c0e;
    --lane: #121317;
    --grid: #18191e;
    --grid-2: #2b2d33;
    --grid-ink: #77756e;
    --stage-ink: #a39d90;
    --paper: #121315;
    --paper-edge: rgb(255 255 255 / 0.06);
    --score-ink: #e9e3d6;
    --rh: #d2a94f;
    --rh-key: #a17c2d;
    --rh-hot: #f8dc94;
    --lh: #4f8fe6;
    --lh-key: #2f64b3;
    --lh-hot: #abcdfb;
    --bar-ink: #171204;
    --note-r: #efc567;
    --note-l: #80b4ff;
    /* depth: a control floating over the music, a menu over that, a knob on a track */
    --shadow-float: 0 10px 36px rgb(0 0 0 / 0.36);
    --shadow-pop: 0 28px 90px rgb(0 0 0 / 0.5), var(--shadow-float);
    --shadow-knob: 0 1px 5px rgb(0 0 0 / 0.45), 0 0 0 0.5px rgb(0 0 0 / 0.2);
    /* glass over the music is calmed so labels hold up when notes pass beneath; surfaces meant
       for reading are calmed further */
    --glass-calm: contrast(0.8) brightness(0.72);
    --glass-read: contrast(0.6) brightness(0.5);

    /* fades: inactive (an unselected label or icon), dim (disabled, or behind an open control),
       faint (the other hand, a readout with notes behind it) */
    --o-inactive: 0.64;
    --o-dim: 0.4;
    --o-faint: 0.2;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    --fs-l: 15px;     /* titles */
    --fs-m: 14px;     /* labels, buttons, values */
    --fs-s: 13px;     /* secondary text */
    --fs-xs: 11px;    /* units, small print */

    --edge: 16px;
    --gutter-l: max(var(--edge), env(safe-area-inset-left, 0px));
    --gutter-r: max(var(--edge), env(safe-area-inset-right, 0px));
    --gap: 8px;
    --control: 44px;
    --under-top: calc(var(--edge) + var(--control) + var(--edge));   /* clear of the controls over the music */
    --readout: 16px;                                                  /* one line of the bar and time readout */
    --above-readout: calc(var(--edge) + var(--readout) + var(--edge));
    --sheet-w: 360px;  /* the speed control */
    --press-grow: 2px; /* how much a pressed control grows on its longer side */
    --seg-margin: 12px; /* the least room either side of a tab bar's label */

    /* the library: large titles and section headings, text fields (16 px: iOS zooms into
       anything smaller), the radius of its flat surfaces (cards, composer tiles), the width of its
       content, and a card on a shelf */
    --fs-title: 32px;
    --fs-h: 20px;
    --fs-field: 16px;
    --r-card: 18px;
    --content-max: 720px;    /* the library's column stops growing here (see .library) */
    --cover-s: 44px;         /* a cover in a list */
    --cover-l: 420px;        /* a cover heading a piece's or a work's page, at most */
    --card-w: 208px;

    --dur-press: 120ms;  /* press feedback, a step of a slider */
    --dur-state: 180ms;  /* colour and opacity changes */
    --dur-move: 280ms;   /* things that move or open */
    --dur-fade: 350ms;   /* slow fades out */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    color-scheme: dark;
  }

  /* ---------- glass material (Graph Notes, src/rendering/glass/material.css) ----------
     The element's CSS box and radius define the surface; js/glass.js draws it. Without WebGL,
     or with reduced transparency, these rules are what shows. */
  .glass-material {
    position: relative;
    isolation: isolate;
    background: var(--glass-fill);
    border: 0;
    -webkit-backdrop-filter: var(--glass-filter);
    backdrop-filter: var(--glass-filter);
  }
  [data-refracted="true"] { isolation: isolate; }
  html .glass-material[data-refracted="true"] {
    background: transparent !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  .glass-refraction {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
    border-radius: 0 !important; display: none;
  }
  [data-refracted="true"] > .glass-refraction { display: block; }
  @media (prefers-contrast: more) {
    .glass-material { background: #202023; outline: 1px solid #85858d; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }

  /* ---------- page ---------- */
  html {
    height: 100%; background: var(--bg);
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    scroll-padding-top: env(safe-area-inset-top, 0px);
    touch-action: pan-x pan-y;
  }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--t1);
    font-family: var(--font); font-size: var(--fs-m); line-height: 1.3;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  *, *::before, *::after { box-sizing: border-box; }
  img { max-width: 100%; }
  [hidden]:not([hidden=until-found i]) { display: none !important; }
  button { font: inherit; color: inherit; margin: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .app { height: 100%; display: flex; flex-direction: column; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- the music ---------- */
  .deck { position: relative; flex: 1 1 0; min-height: 0; --c1: var(--t1); --c2: var(--t2); --cf: var(--fill); }
  .stage {
    position: absolute; top: 0; bottom: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    overflow: hidden; background: var(--stage);
  }
  #roll { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #roll:active { cursor: grabbing; }
  .notation {
    position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    background: var(--stage); -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .notation::-webkit-scrollbar { display: none; }
  .glyphs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .sheet {
    max-width: 1180px; margin: 0 auto; padding: var(--under-top) 6px 46vh;
    background: var(--paper); color: var(--score-ink); min-height: 100%;
    box-shadow: 0 0 0 1px var(--paper-edge);
  }
  .sys { position: relative; width: 100%; max-width: 100%; margin-block: 2px; cursor: pointer; }
  .sys svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .sys svg g[stroke-width] { stroke: currentColor; }
  .sys svg polyline { fill: none; }
  .sys svg g.Note > .on.r { fill: var(--note-r); }
  .sys svg g.Note > .on.l { fill: var(--note-l); }
  /* hand focus: each hand's marks are one layer (see Notation.svgFor), faded as a whole so
     overlapping marks do not stack; barlines and the brace belong to both and stay */
  .sys svg [data-layer] { transition: opacity var(--dur-move) ease-out; }
  .sheet[data-hand="R"] .sys svg [data-layer="1"], .sheet[data-hand="L"] .sys svg [data-layer="0"] { opacity: var(--o-faint); }
  .barno {
    position: absolute; transform: translateY(calc(-100% - var(--sp, 7px) * 1.1));
    font: 600 calc(var(--sp, 7px) * 1.55)/1 var(--font); font-variant-numeric: tabular-nums;
    color: var(--grid-ink); pointer-events: none;
  }
  .cursor { position: absolute; width: 0; pointer-events: none; }
  .cursor::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--sp, 7px) * -1); width: calc(var(--sp, 7px) * 2);
    border-radius: 3px; background: color-mix(in srgb, var(--now) 13%, transparent);
  }
  .cursor::after { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; border-radius: 2px; background: var(--now); }
  .status {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 3;
    max-width: calc(100% - var(--gutter-l) - var(--gutter-r)); text-align: center; text-wrap: balance;
    font-size: var(--fs-l); font-weight: 500; color: var(--stage-ink);
  }

  /* ---------- scroll indicator ----------
     Thin and quiet like iOS's: it only shows while the view is moved by hand, and only then can
     it be grabbed. The hit area is far wider than the pill. It runs from below the controls to
     above the readouts, 3 px in from the edge, as on iOS. */
  .scrub {
    position: absolute; z-index: 4; top: var(--under-top); bottom: var(--above-readout); width: 0;
    right: calc(env(safe-area-inset-right, 0px) + 3px); pointer-events: none;
  }
  .scrub-thumb {
    position: absolute; top: 0; right: 0; width: 4px; height: 36px; border-radius: 4px;
    background: var(--t2); box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.35);
    opacity: 0; will-change: transform; touch-action: none;
    transition: opacity var(--dur-fade) ease-out, width var(--dur-state) var(--ease), background-color var(--dur-state) ease-out;
  }
  .scrub-thumb::before { content: ""; position: absolute; top: -10px; bottom: -10px; left: -28px; right: -4px; }
  .scrub.is-shown .scrub-thumb { opacity: 1; pointer-events: auto; cursor: grab; transition-duration: var(--dur-press), var(--dur-state), var(--dur-state); }
  .scrub.is-dragging .scrub-thumb { width: 8px; background: var(--t1); cursor: grabbing; }
  .scrub-label {
    position: absolute; top: 0; right: 24px; height: 32px; padding: 0 12px; border-radius: 16px;
    display: inline-flex; align-items: center; white-space: nowrap;
    font-size: var(--fs-s); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c1);
    box-shadow: var(--shadow-float); pointer-events: none;
  }
  .scrub-label span { position: relative; }

  /* ---------- glass over the music ---------- */
  .top {
    position: absolute; z-index: 5; top: var(--edge); left: var(--gutter-l); right: var(--gutter-r);
    display: flex; align-items: flex-start; justify-content: space-between; gap: var(--gap);
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .menu-wrap { position: relative; flex: 0 1 auto; min-width: 0; }

  .piece {
    display: flex; align-items: center; gap: var(--gap); max-width: 100%; height: var(--control); padding: 0 14px 0 16px;
    border-radius: 22px; cursor: pointer; text-align: left; color: var(--c1);
    box-shadow: var(--shadow-float);
  }
  .names { display: flex; align-items: baseline; gap: var(--gap); min-width: 0; }
  #title { flex: 0 1 auto; min-width: 0; font-size: var(--fs-l); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #composer { flex: 0 1000 auto; min-width: 0; font-size: var(--fs-s); color: var(--c2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piece > svg { width: 16px; height: 16px; flex: none; transition: transform var(--dur-move) var(--ease), opacity var(--dur-state) ease-out; }
  .piece[aria-expanded="true"] > svg { transform: rotate(180deg); }

  .deck .glass-refraction, .library .glass-refraction { filter: var(--glass-calm); }
  .deck .toast > .glass-refraction { filter: var(--glass-read); }

  /* segmented control: one glass shell, the chosen segment marked by a pill that slides. Like
     every highlight here it sits 4 px inside the glass edge: each 40 px segment keeps its full
     touch area and draws its pill 2 px inside that */
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; flex: none;
    height: var(--control); padding: 2px; border-radius: 22px; color: var(--c2);
  }
  .deck .seg { box-shadow: var(--shadow-float); }
  .seg::after {
    content: ""; position: absolute; z-index: -1; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 4px) / var(--n, 2) - 4px); border-radius: 18px; background: var(--cf);
    transform: translateX(calc(var(--i, 0) * (100% + 4px))); transition: transform var(--dur-move) var(--ease);
  }
  .seg button {
    position: relative; min-width: 0; height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: none;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--gap);
    color: inherit; font-weight: 600; font-size: var(--fs-m); cursor: pointer; transition: color var(--dur-state) ease-out;
  }
  .seg button[aria-pressed="true"] { color: var(--c1); }
  /* a tab bar split in equal parts while they fit, and by its labels when one would crowd: each
     part keeps at least its label and a margin either side, and shares the rest equally. The pill
     then takes its place from the chosen part (app.js FB.placePill sets --pill-x and --pill-w) */
  .seg.fit { grid-auto-columns: unset; grid-template-columns: repeat(var(--n, 2), minmax(max-content, 1fr)); }
  .seg.fit button { padding: 0 var(--seg-margin); }
  .seg.fit::after { left: var(--pill-x, 4px); width: var(--pill-w, 0px); transform: none; transition: left var(--dur-move) var(--ease), width var(--dur-move) var(--ease); }
  .seg.fit.is-placing::after { transition: none; }   /* a bar just built or shown: the pill starts in place */
  .seg button svg { width: 20px; height: 20px; flex: none; }
  /* icons: always drawn in a solid colour; a dimmed icon fades as one layer (opacity on the
     svg), so where its strokes and shapes overlap they never stack into brighter spots */
  .piece > svg, .seg button svg { color: var(--c1); opacity: var(--o-inactive); transition: opacity var(--dur-state) ease-out; }
  .seg button:is([aria-pressed="true"], [data-pressed="true"]) svg { opacity: 1; }
  @media (hover: hover) { .seg button:hover svg { opacity: 1; } }

  .chip {
    position: absolute; left: 50%; bottom: var(--above-readout); transform: translateX(-50%); z-index: 4;
    height: var(--control); padding: 0 16px 0 14px; border-radius: 22px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: var(--gap); font-weight: 600; font-size: var(--fs-m); color: var(--c1);
    box-shadow: var(--shadow-float); animation: rise var(--dur-move) var(--ease);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } }
  .toast {
    position: absolute; left: 50%; top: var(--under-top); transform: translateX(-50%); z-index: 6;
    width: max-content; max-width: calc(100% - var(--gutter-l) - var(--gutter-r)); padding: 12px 16px; border-radius: 22px;
    color: var(--c1); font-size: var(--fs-s); line-height: 1.45; box-shadow: var(--shadow-float);
  }
  .toast span { position: relative; }

  /* ---------- keys ---------- */
  .felt { flex: none; height: 4px; background: var(--felt); }
  .kbd-wrap {
    position: relative; flex: none; height: clamp(80px, min(21vh, 26vw), 172px);
    margin-left: env(safe-area-inset-left, 0px); margin-right: env(safe-area-inset-right, 0px);
    background: var(--bg);
  }
  #kbd { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- playback ---------- */
  .rail {
    flex: none; position: relative; --c1: var(--t1); --c2: var(--t2); --cf: var(--fill);
    display: grid; align-items: center;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: "hands steps tempo";
    padding-block: var(--edge);
    background: var(--bg); touch-action: none;
  }
  .progress {
    position: absolute; z-index: 2; bottom: var(--edge); left: var(--gutter-l); right: var(--gutter-r);
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; font-size: var(--fs-s); line-height: var(--readout); color: var(--t2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .progress > * { transition: opacity var(--dur-state) ease-out; }
  .progress > .is-obscured { opacity: var(--o-faint); transition-duration: var(--dur-press); }
  .progress b { font-weight: 600; color: var(--t1); }

  .rail-slot { position: relative; min-width: 0; }
  .hand-slot { grid-area: hands; justify-self: start; margin-left: var(--gutter-l); }
  .speed-slot { grid-area: tempo; justify-self: end; margin-right: var(--gutter-r); }
  .rail .rail-toggle { display: inline-grid; width: var(--control); height: var(--control); border-radius: 50%; }
  /* icons share one grid: 24 units shown at 20 px, content inside 2-22 and centred, lines 1.8
     units and every gap between parts 1.8 units (roll bars, fingers, the staff lines around the
     note, the speed needle and its dial). Hands use the same scale; the pair in the round toggle
     is shown 17 px tall so it fits the button. */
  .rail-toggle .hand-icon { width: calc(17px * 40.2 / 24); height: 17px; }
  .hand-icon use { stroke: none; }
  .seg .hand-icon.one { width: 20px; height: 20px; }
  .seg .hand-icon.two { width: calc(20px * 40.2 / 24); height: 20px; }
  .hand-icon .left { fill: var(--blue); }
  .hand-icon .right { fill: var(--brass); }
  .hand-toggle[data-hand="L"] .right, .hand-toggle[data-hand="R"] .left {
    fill: var(--c1); opacity: var(--o-inactive);
  }
  .hands button { min-width: 72px; }
  .steps { grid-area: steps; display: flex; align-items: center; gap: var(--gap); }
  .round {
    width: 48px; height: 48px; padding: 0; border-radius: 50%; flex: none; cursor: pointer;
    display: inline-grid; place-items: center; color: var(--t1);
  }
  /* outlined icons all draw 1.5 px lines: 1.8 units of a 24-unit icon at 20 px (the 16 px
     chevron uses 2.25 to match) */
  .round svg { position: relative; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .round:disabled { opacity: var(--o-dim); cursor: default; }
  .play { position: relative; width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--t1); color: var(--bg); isolation: isolate; --cf: var(--fill-ink); }
  .play svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
  .play .i-pause, .play.is-playing .i-play { display: none; }
  .play.is-playing .i-pause { display: block; }

  /* speed: the readout (tap for 100%) and a stepped slider in one glass pill. Three stops either
     side of 100% (25 to 200%), which sits in the middle with a taller tick and catches the thumb from a little
     further away. The fill runs from 100% to the thumb: how far from normal speed, and which way.
     Only the page's own colours: track --fill, fill --t2, thumb --t1, ticks --t2 (--t1 on the
     fill, and always at 100%). The ticks are solid, so they never brighten where they cross the track. The thumb is
     a plain white capsule, never glass: no glass on glass. */
  .tempo {
    display: flex; align-items: center;
    height: var(--control); padding: 2px; border-radius: 22px; color: var(--t1);
  }
  .speed-readout {
    position: relative; flex: none; width: 66px; height: 40px; padding: 0; border: 0; border-radius: 20px; background: none;
    display: grid; place-content: center; text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums;
    color: inherit; cursor: pointer;
  }
  .speed-readout output { font-size: var(--fs-m); font-weight: 600; }
  .speed-readout .bpm { font-size: var(--fs-xs); color: var(--t2); }
  .speed { --inset: 26px; position: relative; flex: 1; min-width: 0; align-self: stretch; border-radius: 20px; touch-action: none; cursor: pointer; }
  .speed:focus-visible { outline-offset: -2px; }
  .speed-track, .speed-ticks { position: absolute; left: var(--inset); right: var(--inset); top: 50%; }
  .speed-track { height: 4px; margin-top: -2px; border-radius: 2px; background: var(--fill); }
  .speed-fill {
    position: absolute; top: 0; bottom: 0; left: calc(var(--fa) * 100%); width: calc((var(--fb) - var(--fa)) * 100%);
    border-radius: inherit; background: var(--t2); transition: left var(--dur-press) var(--ease), width var(--dur-press) var(--ease);
  }
  .speed-ticks i { position: absolute; top: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--t2); }
  .speed-ticks i:is(.on, .home) { background: var(--t1); }
  .speed-ticks i.home { width: 2px; height: 10px; margin: -5px 0 0 -1px; border-radius: 1px; }
  .speed-thumb {
    position: absolute; top: 50%; left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--f));
    width: 36px; height: 24px; margin: -12px 0 0 -18px; border-radius: 12px; pointer-events: none;
    background: var(--t1); box-shadow: var(--shadow-knob);
    transition: left var(--dur-press) var(--ease), transform var(--dur-press) ease-out;
  }
  .speed.is-dragging .speed-thumb { transform: scale(1.035); }

  /* ---------- press and hover ----------
     Pressing a control shows a highlight pill 4 px inside its glass edge and grows the whole shell
     by the same --press-grow on its longer side, whatever its size (app.js sets --press, the
     scale that gives); a round button grows about as much as Graph Notes' Pressable (1.035). Tab
     bars never grow: their pill moves instead. The state comes from JS (data-pressed) so a quick
     tap is still visible. A mouse gets the same pill, fainter, on hover. */
  :is(.piece, .chip, .round, .play, .speed-readout)::after {
    content: ""; position: absolute; z-index: -1; inset: var(--pin, 4px); border-radius: 999px;
    background: var(--cf); opacity: 0; transition: opacity var(--dur-press) ease-out; pointer-events: none;
  }
  .speed-readout { --pin: 2px; }
  :is(.piece, .chip, .round, .play, .speed-readout)[data-pressed="true"]::after { opacity: 1; }
  /* a tab bar never shows a second pill: the label under the finger or pointer goes to full
     strength, and pressing moves the one pill there (js sets --i while pressed) */
  .seg button[data-pressed="true"] { color: var(--c1); }
  @media (hover: hover) {
    :is(.piece, .chip, .round:not(:disabled), .play, .speed-readout):hover::after { opacity: var(--o-inactive); }
    .seg button:hover { color: var(--c1); }
  }
  .piece, .round, .play, .tempo { transition: transform var(--dur-press) ease-out; }
  :is(.piece, .round, .play)[data-pressed="true"], .tempo:has(button[data-pressed="true"]) { transform: scale(var(--press, 1.035)); }
  .chip { transition: transform var(--dur-press) ease-out; }
  .chip[data-pressed="true"] { transform: translateX(-50%) scale(var(--press, 1.035)); }

  .rail-shield { position: absolute; z-index: 3; inset: 0; }
  .rail > :is(.rail-slot, .steps) { transition: filter var(--dur-state) ease-out, opacity var(--dur-state) ease-out; }
  .rail[data-open] > :is(.rail-slot, .steps):not(.is-open) { filter: blur(5px); opacity: var(--o-dim); }
  /* from 1100 px an open control is nowhere near the buttons in the middle: nothing blurs (app.js
     RAIL_ROOM keeps them usable at the same width) */
  @media (min-width: 1100px) { .rail[data-open] > :is(.rail-slot, .steps):not(.is-open) { filter: none; opacity: 1; } }
  .rail .rail-slot.is-open { z-index: 4; }

  .rail-slot:not(.is-open) .rail-options { display: none; }
  .rail-slot.is-open .rail-toggle { visibility: hidden; }
  .rail-options {
    position: absolute; top: 0; width: max-content; max-width: calc(100vw - var(--gutter-l) - var(--gutter-r));
    /* A mask reveals the pill without changing its buttons' hit targets. */
    mask: linear-gradient(#000, #000) left / 100% 100% no-repeat;
    animation: reveal-options var(--dur-move) var(--ease);
  }
  .hand-slot .rail-options { left: 0; }
  .speed-slot .rail-options { right: 0; mask-position: right; }
  .speed-slot .tempo.rail-options { width: var(--sheet-w); }
  /* A sheet that would leave less than twice the edge beside it fills the width instead, so it
     never sits a few pixels off-centre: 360 + 3 x 16 = 408. */
  @media (max-width: 407.98px) {
    .speed-slot .tempo.rail-options { width: calc(100vw - var(--gutter-l) - var(--gutter-r)); }
  }
  @media (max-width: 680px) {
    .hands button { min-width: 0; padding: 0 12px; }
    .steps .round { width: var(--control); height: var(--control); }
    .steps .play { width: 52px; height: 52px; }
  }
  @keyframes reveal-options {
    from { mask-size: var(--control) 100%; }
    to { mask-size: 100% 100%; }
  }
  @media (max-width: 640px) {
    #composer { display: none; }
    .views button span { display: none; }
    .views button { padding: 0 16px; }
  }
  @media (max-height: 540px) {
    .kbd-wrap { height: clamp(58px, 20vh, 104px); }
    .rail { padding-block: var(--gap); }   /* a phone on its side: the keys need the height */
    .steps .play { width: 48px; height: 48px; }
  }
  @media (max-width: 900px) and (max-height: 540px) and (orientation: landscape) {
    .kbd-wrap { height: min(16vh, 72px); }
  }
  @media (max-width: 640px) and (orientation: portrait) {
    .kbd-wrap { height: min(15vw, 78px); }
  }
  /* ---------- the piece menu ----------
     The piece's name opens the pieces opened lately, for a quick switch, and More, which opens
     the library. */
  .menu {
    position: absolute; left: 0; top: calc(100% + var(--gap)); z-index: 20; width: var(--sheet-w);
    padding: 6px; border-radius: 22px; color: var(--c1);
    box-shadow: var(--shadow-pop);
    transform-origin: 24px 0; animation: pop var(--dur-state) var(--ease);
  }
  /* the menu stops an edge short of the bottom of the screen and scrolls inside */
  .menu-content {
    position: relative; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none;
    max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--edge) - var(--control) - var(--gap) - 12px - var(--edge));
  }
  .menu-content::-webkit-scrollbar { display: none; }
  :is(.deck, .library) .menu > .glass-refraction { filter: var(--glass-read); }
  @keyframes pop { from { opacity: 0; transform: scale(0.94); } }
  .menu button {
    position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 1px 12px;
    width: 100%; min-height: 54px; padding: 8px 12px; border: 0; border-radius: 16px;
    background: none; color: inherit; text-align: left; cursor: pointer;
  }
  .menu button:is([data-pressed="true"], [aria-current="true"]) { background: var(--cf); }
  @media (hover: hover) { .menu button:hover { background: var(--cf); } }
  .menu button svg { grid-row: span 2; width: 20px; height: 20px; color: var(--c1); opacity: var(--o-inactive); }
  .menu button b { font-weight: 600; font-size: var(--fs-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu button small { font-size: var(--fs-s); color: var(--c2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu hr { margin: 4px 12px; border: 0; border-top: 1px solid var(--cf); }
  @media (max-width: 407.98px) { .menu { width: calc(100vw - var(--gutter-l) - var(--gutter-r)); } }

  /* ---------- library ----------
     Everything the player can open. The content is flat and matte on the black page; the
     controls float over it as one layer of glass, as on the player: back, a profile, and search
     at the bottom where a thumb reaches it. While searching, Explore's tabs move up into the glass
     layer and the results fill the page. The content fades to black under the search bar so the
     field reads clearly. Colour keeps its meaning: gold and blue are the hands, red is a mark
     (where you left off; a piece still without its own score); surfaces are the roll's greys. */
  .library {
    position: fixed; inset: 0; z-index: 30; overflow: hidden;
    background: var(--bg); color: var(--t1);
    --c1: var(--t1); --c2: var(--t2); --cf: var(--fill);
    --lib-top: calc(env(safe-area-inset-top, 0px) + var(--edge));
    --lib-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--edge));
    /* the content column: its margins, how far shelves run past it (out to the screen's edges),
       and where Explore's tabs pin (an edge below the top bar's buttons) */
    --col-l: var(--gutter-l); --col-r: var(--gutter-r);
    --bleed-l: var(--gutter-l); --bleed-r: var(--gutter-r);
    --stick: calc(var(--lib-top) + var(--control) + var(--edge));
    --page-pb: calc(var(--lib-bottom) + var(--control) + 56px);
    animation: lib-in var(--dur-move) var(--ease);
  }
  /* The column grows with the screen up to --content-max. Its margin is either one edge, or wide
     enough to keep the back and profile buttons outside it (an edge, the button, an edge): never
     in between, where a button would sit half over the content. So it runs edge to edge until
     872 px (720 + 2 × (16 + 44 + 16)), then stops at 720 px, centred. */
  @media (min-width: 872px) {
    .library {
      --col-l: calc((100vw - var(--content-max)) / 2); --col-r: var(--col-l);
      --bleed-l: 0px; --bleed-r: 0px;
    }
  }
  .library.is-closing { animation: lib-out var(--dur-state) ease-in forwards; pointer-events: none; }
  /* the on-screen keyboard is up: it crops the library from below (library.js sets --kb, its
     height, and the list's bottom edge and the search bar ride up on it, in step with it). It
     covers the home indicator, so the search bar keeps only its edge */
  .library { --kb: 0px; --dur-keyboard: 420ms; }
  .library.kb-up { --lib-bottom: var(--edge); }
  /* the hidden field iOS opens the keyboard for (library.js): at the top, where it needs no scrolling to;
     16 px text, or iOS would zoom in on it */
  .lib-proxy { position: absolute; top: var(--lib-top); left: 50%; width: 1px; height: var(--control); padding: 0; border: 0; opacity: 0; font-size: 16px; caret-color: transparent; pointer-events: none; }
  @keyframes lib-in { from { opacity: 0; } }
  @keyframes lib-out { to { opacity: 0; } }
  /* The content fades to black under the glass, reaching black exactly at the glass's outer
     edge: the search bar's bottom, the back button's top. The fades are black layers over the
     content (.lib-fade) and under the glass: on a black page that is the same as fading the
     content out, and it lets glass that sits in the page (Explore's pinned tabs) rise above them
     with the rest of the glass. They follow a smooth S (smoothstep, sampled at quarters: 16 %,
     50 %, 84 %), so they have no visible start or end line. The bottom one runs 64 px above the
     bar, so what passes behind the field is dim enough for its text to read. The top one
     (library.js setFade) is the top bar's depth (button and edge, 60 px) while the page is at its
     top, so it never reaches the page's heading, and grows to twice that over the first 60 px of
     scrolling, so what passes under the small title is dim enough for it to read; while
     Explore's tabs are pinned, to twice their depth. An album cover is dimmed only by half
     (--top-floor: how much still shows at the black end) until the small title shows. The
     variables are registered so they compute to plain numbers and lengths. */
  @property --top-floor { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --top-black { syntax: '<length>'; inherits: true; initial-value: 0px; }
  @property --top-span { syntax: '<length>'; inherits: true; initial-value: 0px; }
  .library {
    --top-floor: 0;
    --top-black: var(--lib-top);
    --top-span: calc(var(--control) + var(--edge));
    --bottom-black: var(--lib-bottom);
    --bottom-span: calc(var(--control) + 64px);
  }
  .lib-scroll {
    position: absolute; inset: 0 0 var(--kb) 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    touch-action: pan-y; scrollbar-width: none;
    /* no -webkit-overflow-scrolling: touch: iOS scrolls smoothly without it, and on the iPhone it
       still makes the scroller a stacking context, which would keep the pinned tabs under the fades */
    transition: bottom var(--dur-keyboard) var(--ease);
  }
  .lib-fade { position: absolute; z-index: 3; left: 0; right: 0; pointer-events: none; }
  .lib-fade.top {
    top: 0; height: calc(var(--top-black) + var(--top-span));
    --k: calc(1 - var(--top-floor));
    background: linear-gradient(to bottom,
      rgb(0 0 0 / var(--k)) var(--top-black),
      rgb(0 0 0 / calc(var(--k) * 0.844)) calc(var(--top-black) + var(--top-span) * 0.25),
      rgb(0 0 0 / calc(var(--k) * 0.5)) calc(var(--top-black) + var(--top-span) * 0.5),
      rgb(0 0 0 / calc(var(--k) * 0.156)) calc(var(--top-black) + var(--top-span) * 0.75),
      transparent 100%);
  }
  .lib-fade.bottom {
    bottom: var(--kb); height: calc(var(--bottom-black) + var(--bottom-span));
    background: linear-gradient(to top,
      #000 var(--bottom-black),
      rgb(0 0 0 / 0.844) calc(var(--bottom-black) + var(--bottom-span) * 0.25),
      rgb(0 0 0 / 0.5) calc(var(--bottom-black) + var(--bottom-span) * 0.5),
      rgb(0 0 0 / 0.156) calc(var(--bottom-black) + var(--bottom-span) * 0.75),
      transparent 100%);
    transition: bottom var(--dur-keyboard) var(--ease);
  }
  .lib-scroll::-webkit-scrollbar { display: none; }
  .lib-page {
    display: flex; flex-direction: column; gap: 32px;
    padding: calc(var(--lib-top) + var(--control) + var(--edge)) var(--col-r) var(--page-pb) var(--col-l);
  }
  .lib-page.is-entering { animation: lib-rise var(--dur-move) var(--ease); }
  @keyframes lib-rise { from { opacity: 0; transform: translateY(12px); } }
  .lib-head { display: flex; flex-direction: column; gap: 4px; }
  .lib-head h1 { margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .lib-head p { margin: 0; font-size: var(--fs-m); color: var(--t2); }
  .lib-head .link { padding: 0; border: 0; background: none; color: var(--t2); font: inherit; font-size: var(--fs-m); text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--grid-2); text-underline-offset: 3px; }
  @media (hover: hover) { .lib-head .link:hover { color: var(--t1); } }
  .lib-sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .lib-sec h2 { margin: 0; font-size: var(--fs-h); font-weight: 650; letter-spacing: -0.01em; }
  .see-all { padding: 4px 0; border: 0; background: none; color: var(--t2); font: inherit; font-size: var(--fs-m); font-weight: 600; cursor: pointer; }
  @media (hover: hover) { .see-all:hover { color: var(--t1); } }
  .lib-note { margin: 0; font-size: var(--fs-m); line-height: 1.5; color: var(--t2); max-width: 60ch; }
  .lib-about { margin: 0; font-size: var(--fs-l); line-height: 1.55; color: var(--t1); max-width: 62ch; text-align: justify; hyphens: auto; -webkit-hyphens: auto; text-wrap: pretty; }

  /* a red dot after a name: no score of its own yet */
  .dot { display: inline-block; width: 6px; height: 6px; margin: 0 0 0 7px; border-radius: 50%; background: var(--now); vertical-align: 0.2em; }

  /* a shelf of cards, scrolled sideways: out to the screen's edges, or within the column once it
     has stopped growing */
  .shelf {
    display: flex; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory;
    margin-inline: calc(-1 * var(--bleed-l)) calc(-1 * var(--bleed-r)); padding-inline: var(--bleed-l) var(--bleed-r);
    scroll-padding-inline: var(--bleed-l) var(--bleed-r); scrollbar-width: none; touch-action: pan-x pan-y;
  }
  .shelf::-webkit-scrollbar { display: none; }
  /* with a mouse: one row of cards filling the column, as many as fit (library.js fitShelves) */
  .shelf.fitted { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); overflow: visible; margin-inline: 0; padding-inline: 0; }
  .shelf.fitted .card { width: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr)); gap: 12px; }
  /* a card: one picture filling it (the piece's opening as a piano roll, library.js drawThumb),
     fading into darkness at the bottom, where its name is written. No box under the text */
  .card {
    position: relative; isolation: isolate; flex: none; width: var(--card-w); aspect-ratio: 4 / 5; scroll-snap-align: start;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 0; border: 0; border-radius: var(--r-card); overflow: hidden;
    background: var(--stage); color: inherit; text-align: left; cursor: pointer;
  }
  .cards .card { width: auto; }
  .card .roll, .card .art { position: absolute; inset: 0; z-index: -2; display: block; width: 100%; height: 100%; }
  .card .art { display: grid; place-items: center; padding-bottom: 34%; }
  .card .art svg { width: 28px; height: 28px; fill: none; stroke: var(--t1); stroke-width: 1.8; stroke-linecap: round; opacity: var(--o-inactive); }
  .card .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, transparent 52%, var(--bg) 92%); pointer-events: none; }
  .card .txt { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0 12px 12px; }
  .card b, .card small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card b { font-size: var(--fs-m); font-weight: 600; }
  .card small { font-size: var(--fs-s); color: var(--t2); }
  .card .where { margin-top: 4px; font-size: var(--fs-xs); color: var(--t2); font-variant-numeric: tabular-nums; }

  /* composers: a tile each, with their lifetime on one shared line from 1680 to 1980 */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
  .tile {
    position: relative; isolation: isolate; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 100px;
    padding: 14px 14px 16px; border: 0; border-radius: var(--r-card); background: var(--lane);
    color: inherit; text-align: left; cursor: pointer;
  }
  .tile b { font-size: var(--fs-l); font-weight: 600; }
  .tile small { font-size: var(--fs-s); color: var(--t2); font-variant-numeric: tabular-nums; }
  .era { position: relative; margin-top: auto; height: 4px; border-radius: 2px; background: var(--fill); }
  .era i { position: absolute; top: 0; bottom: 0; left: calc(var(--a) * 100%); width: calc((var(--b) - var(--a)) * 100%); border-radius: 2px; background: var(--t2); }

  /* lists: plain rows on the page with hairlines between them. Wide screens set them in columns
     that read down, then across */
  .rows { margin-inline: -12px; }
  .rows.cols { columns: 300px 3; column-gap: 24px; }
  .row {
    position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
    width: 100%; min-height: 58px; padding: 8px 12px; border: 0; border-radius: 14px; background: none;
    color: inherit; text-align: left; cursor: pointer; break-inside: avoid;
  }
  .row.one { min-height: 48px; }
  .row.num { grid-template-columns: 2.4ch minmax(0, 1fr) auto; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 12px; right: 12px; border-top: 1px solid var(--grid-2); }
  .row.num + .row.num::before { left: calc(12px + 2.4ch + 12px); }
  .row.has-cover { grid-template-columns: var(--cover-s) minmax(0, 1fr) auto; }
  .row.has-cover + .row.has-cover::before { left: calc(12px + var(--cover-s) + 12px); }

  /* ---------- covers ----------
     Every piece and work has artwork of its own, built by library.js cover() from its id: a mesh
     gradient from one of a dozen palettes, one of four layouts (an echoed title, an engraved
     frame, a giant numeral, a title on a staff), bold italic display serifs and fine lines, its
     most remembered name (the nickname when it has one) large. Everything inside is measured in
     cqw, a hundredth of the cover's own width, so a cover is the same picture at every size. The
     palette and the colours inside are artwork, not interface: they follow none of the page's
     colour tokens. */
  .cover {
    position: relative; flex: none; overflow: hidden; container-type: inline-size; aspect-ratio: 1;
    width: var(--cover-s); border-radius: 8px; color: var(--ink); background: var(--mesh); text-align: left;
    font-synthesis: none; line-height: 1; -webkit-font-smoothing: antialiased;
  }
  .cover > * { position: absolute; margin: 0; }
  .cover .who { font: 400 4.4cqw/1 Switzer, var(--font); letter-spacing: 0.24em; text-transform: uppercase; }
  .cover .cat { font: 400 4.4cqw/1 Switzer, var(--font); letter-spacing: 0.06em; }
  .cover .main { font: var(--face-style, italic) var(--face-weight, 900) var(--ts) / 0.92 var(--face); letter-spacing: -0.01em; text-wrap: balance; }
  .cover .sub { font: italic 500 5.8cqw/1.15 Boska, Georgia, serif; }
  .cover .line { border-color: var(--line); }
  /* ornaments (library.js): drawn in a 100-unit square over the whole cover, or a 100 × 8 strip */
  .cover svg { color: var(--line); overflow: visible; }
  .cover .orn { inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cover .divider { width: 60cqw; height: 4.8cqw; }

  /* an echoed title: the name large, with its outline repeated above and below, and a dotted
     corner like a printer's mark */
  .cv-echo .who { left: 7cqw; bottom: 8cqw; }
  .cv-echo .sub { left: 7cqw; right: 7cqw; bottom: 14cqw; }
  .cv-echo .cat { right: 7cqw; bottom: 7.6cqw; }

  /* an engraved frame, as on a nineteenth-century edition: two rules, an ornament under the
     composer, everything centred */
  .cv-frame .stack { inset: 12cqw 11cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2cqw; text-align: center; }
  .cv-frame .stack > * { position: static; }

  /* a giant numeral (or letter) in outline, bleeding off the corner, the name set beside it */
  .cv-num .who { left: 8cqw; top: 8cqw; }
  .cv-num .main { left: 8cqw; right: 8cqw; bottom: 17cqw; }
  .cv-num .sub { left: 8cqw; right: 8cqw; bottom: 8.5cqw; }
  .cv-num .cat { left: 8cqw; top: 13.5cqw; }

  /* the name riding across a staff of five fine lines */
  .cv-staff .staff { left: 0; right: 0; top: 58cqw; height: 22.5cqw; background: repeating-linear-gradient(to bottom, var(--line) 0 0.5cqw, transparent 0.5cqw 5.5cqw); }
  .cv-staff .main { left: 7cqw; right: 7cqw; bottom: 47cqw; }   /* above the staff, so thin letters stay clear of its lines */
  .cv-staff .who { left: 7cqw; top: 8cqw; }
  .cv-staff .cat { right: 7cqw; top: 7.6cqw; }
  .cv-staff .sub { left: 7cqw; right: 7cqw; bottom: 7.5cqw; }

  /* #library/~covers: covers side by side, large, each with its name under it */
  .cover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px 16px; }
  .cover-pick { display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: none; color: var(--t2); font: inherit; font-size: var(--fs-s); text-align: left; cursor: pointer; }
  .cover-pick .cover { width: 100%; border-radius: 10px; }

  /* a piece's or a work's page opens on its cover, as an album does: large and centred, its
     colours glowing behind the heading, the name and the buttons centred under it */
  .hero { position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .hero-glow {
    position: absolute; z-index: -1; left: calc(-1 * var(--col-l)); right: calc(-1 * var(--col-r));
    top: calc(-1 * (var(--lib-top) + var(--control) + var(--edge))); height: calc(100% + 120px);
    background: var(--mesh); filter: blur(70px) saturate(1.2); opacity: 0.5; pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent); mask-image: linear-gradient(to bottom, #000 35%, transparent);
  }
  .hero .cover { width: min(100%, var(--cover-l)); border-radius: 12px; box-shadow: 0 30px 90px rgb(0 0 0 / 0.55); }
  .hero-text { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .hero-text h1 { margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .hero-text p { margin: 0; font-size: var(--fs-m); color: var(--t2); }
  .hero-text .link { padding: 0; border: 0; background: none; color: var(--t1); font: inherit; font-size: var(--fs-l); font-weight: 600; cursor: pointer; }
  .hero-text .link.quiet { color: var(--t2); font-size: var(--fs-m); font-weight: 400; }
  @media (hover: hover) { .hero-text .link:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .hero .actions { justify-content: center; margin-top: 10px; }
  .row .main { min-width: 0; }
  .row b, .row small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row b { font-size: var(--fs-l); font-weight: 600; }
  .row.one b { font-weight: 500; }
  .row small { margin-top: 2px; font-size: var(--fs-s); color: var(--t2); }
  /* a track number, or a work's catalogue number, in grey before the name */
  .row .n { font-size: var(--fs-l); color: var(--t2); font-variant-numeric: tabular-nums; text-align: right; }
  .row b .cat { margin-right: 8px; font-weight: 500; color: var(--t2); }
  .row .aside { display: flex; align-items: center; gap: var(--gap); color: var(--t2); }
  /* Henle's level of difficulty, at the end of a row: "6/9", or a work's range, "4–6/9" */
  .lvl { display: inline-flex; align-items: baseline; padding: 3px 8px; border-radius: 999px; background: var(--fill); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lvl b { font-size: var(--fs-s); font-weight: 600; color: var(--t1); }
  .lvl small { font-size: var(--fs-xs); font-weight: 500; color: var(--t2); }
  .row .aside svg { width: 16px; height: 16px; color: var(--t1); opacity: var(--o-inactive); }
  @media (min-width: 632px) { .rows.cols .row::before { display: none; } }   /* two columns of 300 px fit from here */

  /* flat pressed and hover states for content: a wash over the surface, nothing scales */
  :is(.card, .tile, .row, .btn)::after {
    content: ""; position: absolute; z-index: -1; inset: 0; border-radius: inherit;
    background: var(--cf); opacity: 0; transition: opacity var(--dur-press) ease-out; pointer-events: none;
  }
  :is(.card, .tile, .row, .btn)[data-pressed="true"]::after { opacity: 1; }
  @media (hover: hover) { :is(.card, .tile, .row, .btn):hover::after { opacity: var(--o-inactive); } }
  .row:is(:hover, [data-pressed="true"])::before, .row:is(:hover, [data-pressed="true"]) + .row::before { opacity: 0; }

  /* Explore: the heading and its tabs pin under the back button (or an edge from the top on wide
     screens) and the list runs on beneath them. The section is at least as tall as the screen
     below that point, so the page can always scroll until the heading pins. The tabs are glass,
     the same control the search shows at the top; behind the heading the page is black, fading
     out across the tabs so the list shows through them. */
  .explore { min-height: calc(100dvh - var(--stick) - var(--page-pb)); }
  .explore-mark { height: 0; margin-bottom: -12px; }   /* where the tabs sit in the page (library.js pinCheck) */
  /* above the fades (z-index 3), with the rest of the glass: the page has no stacking context of
     its own, so this counts in the library's */
  .explore-tabs { position: sticky; top: var(--stick); z-index: 4; }
  .library .seg { box-shadow: var(--shadow-float); }

  /* buttons on a piece's page: one white for the main action, the rest flat */
  .actions { display: flex; flex-wrap: wrap; gap: var(--gap); margin-top: 16px; }
  .btn {
    position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: var(--gap);
    height: var(--control); min-width: var(--control); padding: 0 18px; border: 0; border-radius: 22px;
    background: var(--lane); color: var(--t1); font: inherit; font-weight: 600; font-size: var(--fs-m); cursor: pointer;
  }
  .btn.main { background: var(--t1); color: var(--bg); --cf: var(--fill-ink); padding: 0 22px 0 18px; }
  .btn.icon { padding: 0; }
  .btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn.main svg { fill: currentColor; stroke: currentColor; stroke-width: 2; }
  .btn:disabled { opacity: var(--o-dim); cursor: default; }

  /* a piece's details: label above value, in as many columns as fit */
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px 24px; margin: 0; }
  .facts div { min-width: 0; }
  .facts dt { font-size: var(--fs-xs); font-weight: 600; color: var(--t2); }
  .facts dd { margin: 2px 0 0; font-size: var(--fs-l); }
  .facts dd .by { margin-left: 4px; font-size: var(--fs-s); color: var(--t2); text-decoration: underline; text-decoration-color: var(--grid-2); text-underline-offset: 3px; }
  .facts dd button { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--grid-2); text-underline-offset: 3px; }

  /* the sheet music as it will print: A4 pages in a shelf */
  .pages { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    margin-inline: calc(-1 * var(--bleed-l)) calc(-1 * var(--bleed-r)); padding-inline: var(--bleed-l) var(--bleed-r); scroll-padding-inline: var(--bleed-l) var(--bleed-r); }
  .pages::-webkit-scrollbar { display: none; }
  .sheet-page { flex: none; width: var(--page-w, 220px); aspect-ratio: 210 / 297; padding: 0; border: 0; border-radius: 6px; overflow: hidden; scroll-snap-align: start; background: var(--lane); cursor: zoom-in; }
  .sheet-page img { display: block; width: 100%; height: 100%; background: #fff; }
  /* a carousel's arrows: glass, at its sides, halfway down */
  .carousel { position: relative; }
  .carousel-arrow { position: absolute; z-index: 2; top: 50%; width: var(--control); height: var(--control); margin-top: calc(var(--control) / -2); box-shadow: var(--shadow-float); }
  .carousel-arrow.prev { left: var(--gap); }
  .carousel-arrow.next { right: var(--gap); }
  /* the sheet music full screen: one page at a time, as large as fits between the controls */
  .viewer { position: absolute; inset: 0; z-index: 8; background: var(--bg); animation: lib-in var(--dur-move) var(--ease); }
  .viewer-pages {
    --vp-w: min(calc(100vw - 2 * var(--edge)), calc((100dvh - 2 * (var(--lib-top) + var(--control) + var(--edge))) * 210 / 297));
    position: absolute; inset: 0; display: flex; align-items: center; column-gap: 24px; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scrollbar-width: none; padding-inline: calc((100vw - var(--vp-w)) / 2);
  }
  .viewer-pages::-webkit-scrollbar { display: none; }
  .viewer-page { flex: none; width: var(--vp-w); aspect-ratio: 210 / 297; border-radius: 4px; overflow: hidden; scroll-snap-align: center; background: #fff; }
  .viewer-page img { display: block; width: 100%; height: 100%; }
  .viewer .round { width: var(--control); height: var(--control); box-shadow: var(--shadow-float); }
  .viewer-close { position: absolute; z-index: 2; top: var(--lib-top); left: var(--gutter-l); }
  .viewer-save { position: absolute; z-index: 2; top: var(--lib-top); right: var(--gutter-r); }
  .viewer .carousel-arrow.prev { left: var(--gutter-l); }
  .viewer .carousel-arrow.next { right: var(--gutter-r); }
  .sheet-page.is-waiting { display: grid; place-items: center; padding: 16px; text-align: center; font-size: var(--fs-s); color: var(--t2); }

  /* the glass layer */
  .lib-top {
    position: absolute; z-index: 4; top: var(--lib-top); left: var(--gutter-l); right: var(--gutter-r);
    display: flex; align-items: center; gap: var(--gap); pointer-events: none;
  }
  .lib-top > * { pointer-events: auto; }
  .lib-top .grow { flex: 1; }
  .lib-top .round { width: var(--control); height: var(--control); box-shadow: var(--shadow-float); }
  .lib-top .round svg.filled { fill: currentColor; stroke: none; }
  /* the page's name, small and centred between the buttons, once its heading has scrolled up
     under the bar (library.js titleCheck): a piece's or a work's composer under it */
  .lib-top .lib-title {
    position: absolute; top: 0; left: calc(var(--control) + var(--gap)); right: calc(var(--control) + var(--gap)); height: var(--control);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0;
    text-align: center; pointer-events: none;
    opacity: 0; transform: translateY(6px);
    transition: opacity var(--dur-move) var(--ease), transform var(--dur-move) var(--ease);
  }
  .lib-top .lib-title.is-on { opacity: 1; transform: none; }
  .lib-title b, .lib-title small { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.25; }
  .lib-title b { font-size: var(--fs-l); font-weight: 600; }
  .lib-title small { font-size: var(--fs-xs); color: var(--t2); }
  .lib-title small:empty { display: none; }
  .library.is-searching .lib-title { visibility: hidden; }
  /* the search's tabs: from an edge beside the back button to the screen's edge, or the column's
     width once it has stopped growing */
  .lib-scopes { position: absolute; top: 0; left: calc(var(--control) + var(--edge)); right: 0; animation: scopes-in var(--dur-move) var(--ease); }
  @media (min-width: 872px) { .lib-scopes { left: calc(var(--col-l) - var(--gutter-l)); right: calc(var(--col-r) - var(--gutter-r)); } }
  @keyframes scopes-in { from { opacity: 0; transform: translateY(28px); } }
  .library.is-searching :is(#libProfile, #libMore) { display: none; }
  /* the menu under the ellipsis, against the right edge */
  .lib-menu { left: auto; right: var(--gutter-r); top: calc(var(--lib-top) + var(--control) + var(--gap)); z-index: 5; transform-origin: calc(100% - 22px) 0; }
  .lib-bottom { position: absolute; z-index: 4; left: var(--col-l); right: var(--col-r); bottom: calc(var(--lib-bottom) + var(--kb)); transition: bottom var(--dur-keyboard) var(--ease); }
  .lib-search {
    display: flex; align-items: center; gap: var(--gap); height: var(--control); padding: 0 4px 0 14px;
    border-radius: 22px; color: var(--c1); box-shadow: var(--shadow-float); cursor: text;
  }
  .lib-search > svg { position: relative; flex: none; width: 20px; height: 20px; opacity: var(--o-inactive); }
  .lib-search input {
    position: relative; flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; outline: none;
    color: inherit; font: inherit; font-size: var(--fs-field); -webkit-user-select: text; user-select: text;
  }
  .lib-search input::placeholder { color: var(--c2); }
  .lib-search input::-webkit-search-cancel-button { display: none; }
  .lib-search .clear { position: relative; flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; }
  .lib-search .clear svg { width: 18px; height: 18px; fill: var(--t2); }

  @media (max-width: 640px) {
    .library { --card-w: 176px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sheet-page { --page-w: 168px; }
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app" id="app" data-view="roll">
  <div class="deck" id="deck">
    <main class="stage" id="stage">
      <canvas id="roll" aria-label="Falling notes"></canvas>
      <div class="notation" id="notation" tabindex="0" aria-label="Sheet music" hidden><div class="sheet" id="pages" data-hand="both"></div></div>
      <div class="status" id="status" role="status" hidden></div>
    </main>

    <div class="progress">
      <span id="barReadout">Bar <b id="where">1</b> <span id="whereOf"></span></span>
      <span id="clock">0:00 / 0:00</span>
    </div>

    <div class="scrub" id="scrub" aria-hidden="true">
      <div class="scrub-thumb" id="scrubThumb"></div>
      <div class="scrub-label glass-material" id="scrubLabel" hidden><span id="scrubText"></span></div>
    </div>

    <header class="top">
      <div class="menu-wrap">
        <button type="button" class="piece glass-material" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Recent pieces and the library">
          <span class="names"><span id="title">Fallboard</span><span id="composer"></span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <!-- recent pieces, then More for the library -->
        <div class="menu glass-material" id="menu" hidden>
          <div class="menu-content">
            <div id="menuRecents"></div>
            <hr>
            <button type="button" id="menuMore">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/></svg>
              <b>More</b><small>The whole library and search</small>
            </button>
          </div>
        </div>
        <template id="menuRow">
          <button type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><g transform="translate(12 12) scale(0.94) translate(-11.5 -12)"><path fill-rule="evenodd" d="M8.1 14.71V5q0-.75.74-.88l11-2Q20.9 1.93 20.9 3v13a3.9 3.9 0 1 1-1.8-3.29V4.08l-9.2 1.67V18a3.9 3.9 0 1 1-1.8-3.29ZM8.1 18a2.1 2.1 0 1 0-4.2 0 2.1 2.1 0 1 0 4.2 0ZM19.1 16a2.1 2.1 0 1 0-4.2 0 2.1 2.1 0 1 0 4.2 0Z"/></g></svg>
            <b></b><small></small>
          </button>
        </template>
      </div>

      <div class="seg views glass-material" id="viewSeg" role="group" aria-label="View" style="--n:2;--i:0">
        <button type="button" data-view="roll" aria-pressed="true" aria-label="Falling notes">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.45" y="3" width="4.5" height="9" rx="2"/><rect x="9.75" y="9" width="4.5" height="12" rx="2"/><rect x="16.05" y="5" width="4.5" height="7" rx="2"/></svg><span>Roll</span>
        </button>
        <button type="button" data-view="score" aria-pressed="false" aria-label="Sheet music">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><defs><mask id="fb-staff-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><ellipse cx="9.4" cy="15.85" rx="2.9" ry="2.2" transform="rotate(-22 9.4 15.85)" fill="#000" stroke="#000" stroke-width="3.6"/><path d="M11.31 15.4V5.75" stroke="#000" stroke-width="5.4"/></mask></defs><path d="M3 8.25h18M3 13.25h18M3 18.25h18" mask="url(#fb-staff-gap)"/><ellipse cx="9.4" cy="15.85" rx="2.9" ry="2.2" transform="rotate(-22 9.4 15.85)" fill="currentColor" stroke="none"/><path d="M11.31 15.4V5.75"/></svg><span>Score</span>
        </button>
      </div>
    </header>

    <button type="button" class="chip glass-material" id="liveBtn" hidden><i></i>Back to playback</button>
    <div class="toast glass-material" id="toast" role="alert" hidden><span id="toastText"></span></div>
  </div>

  <div class="felt"></div>
  <div class="kbd-wrap" id="kbdWrap"><canvas id="kbd" aria-label="Piano keyboard"></canvas></div>

  <!-- one hand, drawn once: the left hand as is, the right hand mirrored -->
  <svg class="vh" aria-hidden="true"><defs><path id="fb-hand" d="M5.4 12.3V5.9a1.05 1.05 0 0 1 2.1 0v3.5a0.9 0.9 0 0 0 1.8 0V4.4a1.05 1.05 0 0 1 2.1 0v5a0.9 0.9 0 0 0 1.8 0V5.2a1.05 1.05 0 0 1 2.1 0v4.2a0.9 0.9 0 0 0 1.8 0V7.1a1.05 1.05 0 0 1 2.1 0v6.8c0 4.2-2.2 6.8-5.8 6.8h-3.8c-2.4 0-4.1-1.2-5.4-3.4l-2.3-4.1a1.2 1.2 0 0 1 1.9-1.4L4.78 12.85Q5.4 13.5 5.4 12.6z"/></defs></svg>

  <footer class="rail" id="rail">
    <div class="rail-slot hand-slot" id="handSlot" hidden>
      <button type="button" class="round rail-toggle hand-toggle glass-material" id="handToggle" aria-label="Hands: Both" aria-controls="handSeg" aria-expanded="false">
        <svg class="hand-icon" viewBox="0 0 40.2 24" aria-hidden="true"><use class="left" href="#fb-hand"/><use class="right" href="#fb-hand" transform="translate(40.2 0) scale(-1 1)"/></svg>
      </button>
      <div class="seg hands rail-options glass-material" id="handSeg" role="group" aria-label="Hands" style="--n:3;--i:1">
        <button type="button" data-hand="L" aria-pressed="false"><svg class="hand-icon one" viewBox="-1.5 0 24 24" aria-hidden="true"><use class="left" href="#fb-hand"/></svg>Left</button>
        <button type="button" data-hand="both" aria-pressed="true"><svg class="hand-icon two" viewBox="0 0 40.2 24" aria-hidden="true"><use class="left" href="#fb-hand"/><use class="right" href="#fb-hand" transform="translate(40.2 0) scale(-1 1)"/></svg>Both</button>
        <button type="button" data-hand="R" aria-pressed="false"><svg class="hand-icon one" viewBox="-1.5 0 24 24" aria-hidden="true"><use class="right" href="#fb-hand" transform="translate(21 0) scale(-1 1)"/></svg>Right</button>
      </div>
    </div>

    <div class="steps" id="steps">
      <button type="button" class="round glass-material" id="prevBtn" aria-label="Previous note" title="Previous note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M10.5 5.5 4 12l6.5 6.5"/></svg></button>
      <button type="button" class="round play" id="playBtn" aria-label="Play">
        <!-- equilateral, its centroid (one third in from the flat side) on the circle's centre; the round stroke softens the corners without moving it -->
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.54 6 L18.93 12 L8.54 18 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.3"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.3"/></svg>
      </button>
      <button type="button" class="round glass-material" id="nextBtn" aria-label="Next note" title="Next note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M13.5 5.5 20 12l-6.5 6.5"/></svg></button>
    </div>

    <div class="rail-slot speed-slot" id="speedSlot">
      <button type="button" class="round rail-toggle glass-material" id="speedToggle" aria-label="Playback speed: 100%" aria-controls="tempoBox" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="fb-dial-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path id="speedNeedleGap" d="M12 12V3.9" stroke="#000" stroke-width="5.4"/></mask></defs><path d="M4.63 17.16A9 9 0 1 1 19.37 17.16" mask="url(#fb-dial-gap)"/><path id="speedNeedle" d="M12 12V3.9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="tempo rail-options glass-material" id="tempoBox" role="group" aria-label="Playback speed">
        <button type="button" class="speed-readout" id="speedReset" title="Back to 100%">
          <output id="speedOut">100%</output>
          <span class="bpm"><span id="tempo">60</span> bpm</span>
        </button>
        <div class="speed" id="speed" role="slider" tabindex="0" aria-label="Playback speed" aria-valuemin="25" aria-valuemax="200" aria-valuenow="100" aria-valuetext="100%" style="--f:0.5;--fa:0.5;--fb:0.5">
          <div class="speed-track" id="speedTrack"><div class="speed-fill"></div></div>
          <div class="speed-ticks" id="speedTicks"></div>
          <div class="speed-thumb" id="speedThumb"></div>
        </div>
      </div>
    </div>
    <div class="rail-shield" id="railShield" aria-hidden="true" hidden></div>
  </footer>
</div>

<!-- the library: flat content in .lib-scroll; the glass layer (.lib-top, .lib-bottom) over it -->
<div class="library" id="library" role="dialog" aria-modal="true" aria-label="Library" hidden>
  <div class="lib-scroll" id="libScroll"><div class="lib-page" id="libPage"></div></div>
  <div class="lib-fade top" aria-hidden="true"></div>
  <div class="lib-fade bottom" aria-hidden="true"></div>
  <input type="search" class="lib-proxy" id="libProxy" tabindex="-1" aria-hidden="true" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">

  <header class="lib-top">
    <button type="button" class="round glass-material" id="libBack" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
    </button>
    <!-- the page's name, once its heading has scrolled away -->
    <div class="lib-title" id="libTitle" aria-hidden="true"><b></b><small></small></div>
    <!-- while searching: what to search, moved up from Explore's tabs -->
    <div class="seg fit lib-scopes glass-material" id="libScopes" role="group" aria-label="Search in" style="--n:3;--i:0" hidden>
      <button type="button" data-tab="pieces" aria-pressed="true">Pieces</button>
      <button type="button" data-tab="works" aria-pressed="false">Works</button>
      <button type="button" data-tab="composers" aria-pressed="false">Composers</button>
    </div>
    <span class="grow"></span>
    <!-- a place for accounts on the library's home; it does nothing yet -->
    <button type="button" class="round glass-material" id="libProfile" aria-label="Profile (coming soon)" title="Profile (coming soon)">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><circle cx="12" cy="8.2" r="4.2"/><path d="M4.2 20.2c0-4.1 3.5-6.9 7.8-6.9s7.8 2.8 7.8 6.9c0 .55-.45 1-1 1H5.2c-.55 0-1-.45-1-1Z"/></svg>
    </button>
    <!-- on a composer's, a work's or a piece's page: what can be done with it -->
    <button type="button" class="round glass-material" id="libMore" aria-label="More" title="More" aria-haspopup="true" aria-expanded="false" aria-controls="libMenu" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/></svg>
    </button>
  </header>
  <div class="menu lib-menu glass-material" id="libMenu" hidden>
    <div class="menu-content">
      <button type="button" id="libShare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        <b>Share</b><small id="libShareNote">Send a link to this page</small>
      </button>
    </div>
  </div>

  <div class="lib-bottom" id="libBottom">
    <label class="lib-search glass-material" id="libSearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6"/><path d="m15.4 15.4 5.1 5.1"/></svg>
      <input type="search" id="libQuery" placeholder="Search pieces" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search the catalogue">
      <button type="button" class="clear" id="libClear" aria-label="Clear the search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-3.3 5.4L12 10.7l3.3-3.3 1.3 1.3-3.3 3.3 3.3 3.3-1.3 1.3-3.3-3.3-3.3 3.3-1.3-1.3 3.3-3.3-3.3-3.3 1.3-1.3Z"/></svg>
      </button>
    </label>
  </div>
</div>
<input type="file" id="fileInput" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" hidden>

<script src="js/score.js"></script>
<script src="js/audio.js"></script>
<script src="js/glass.js"></script>
<script src="js/engrave-core.js"></script>
<script src="js/print.js"></script>
<script src="js/notation.js"></script>
<script src="js/app.js"></script>
<script src="js/library.js"></script>

</body></html>
