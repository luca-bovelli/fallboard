<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Fallboard Piano</title>
<link rel="license" href="credits.html">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
  /* Layout: the music fills the page down to the keys. What you are looking at (the piece, roll
     or score) floats over the top of it as glass; how it plays back (which hands, step and play,
     how fast) sits under the keys on the black page. Colour is kept for meaning: one hue per hand,
     red for "now"; everything else is white or grey. The controls are the Graph Notes glass
     material; the keyboard and the music are matte.

     Every length, size, duration and fade below comes from these tokens. One edge (16 px) sets
     the margin on every side; controls are 44 px; gaps are 8 px. */
  :root {
    /* the page and its greys: text, secondary text, a light wash and its dark twin */
    --bg: #000000;
    --t1: #f5f5f7;
    --t2: #a1a1a8;
    --fill: rgb(255 255 255 / 0.15);
    --fill-ink: rgb(0 0 0 / 0.15);
    --focus: #0a84ff;
    --brass: #d9b15c;
    --brass-lo: #9c7a2c;
    --blue: #5b9df5;
    --blue-lo: #2f6bc4;
    --felt: #8f1a25;
    --now: #f0475a;
    --key-a: #fbf8f0;
    --key-b: #ebe5d7;
    --key-c: #cfc7b4;
    --key-ink: #6f6858;
    --ebony-a: #3b3b41;
    --ebony-b: #1a1a1d;
    --ebony-c: #0a0a0b;
    --glass-fill: rgb(76 76 76 / 42%);
    --glass-filter: blur(8px) saturate(150%) brightness(1.08);
    --glass-lighting-brightness: 1;

    /* the music */
    --stage: #0b0c0e;
    --lane: #121317;
    --grid: #18191e;
    --grid-2: #2b2d33;
    --grid-ink: #77756e;
    --stage-ink: #a39d90;
    --paper: #121315;
    --paper-edge: rgb(255 255 255 / 0.06);
    --score-ink: #e9e3d6;
    --rh: #d2a94f;
    --rh-key: #a17c2d;
    --rh-hot: #f8dc94;
    --lh: #4f8fe6;
    --lh-key: #2f64b3;
    --lh-hot: #abcdfb;
    --bar-ink: #171204;
    --note-r: #efc567;
    --note-l: #80b4ff;
    /* depth: a control floating over the music, a menu over that, a knob on a track */
    --shadow-float: 0 10px 36px rgb(0 0 0 / 0.36);
    --shadow-pop: 0 28px 90px rgb(0 0 0 / 0.5), var(--shadow-float);
    --shadow-knob: 0 1px 5px rgb(0 0 0 / 0.45), 0 0 0 0.5px rgb(0 0 0 / 0.2);
    /* glass over the music is calmed so labels hold up when notes pass beneath; surfaces meant
       for reading are calmed further */
    --glass-calm: contrast(0.8) brightness(0.72);
    --glass-read: contrast(0.6) brightness(0.5);

    /* fades: inactive (an unselected label or icon), dim (disabled, or behind an open control),
       faint (the other hand, a readout with notes behind it) */
    --o-inactive: 0.64;
    --o-dim: 0.4;
    --o-faint: 0.2;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    --fs-l: 15px;     /* titles */
    --fs-m: 14px;     /* labels, buttons, values */
    --fs-s: 13px;     /* secondary text */
    --fs-xs: 11px;    /* units, small print */

    --edge: 16px;
    --gutter-l: max(var(--edge), env(safe-area-inset-left, 0px));
    --gutter-r: max(var(--edge), env(safe-area-inset-right, 0px));
    --gap: 8px;
    --control: 44px;
    --under-top: calc(var(--edge) + var(--control) + var(--edge));   /* clear of the controls over the music */
    --readout: 16px;                                                  /* one line of the bar and time readout */
    --above-readout: calc(var(--edge) + var(--readout) + var(--edge));
    --sheet-w: 360px;  /* the scores menu and the speed control */

    --dur-press: 120ms;  /* press feedback, a step of a slider */
    --dur-state: 180ms;  /* colour and opacity changes */
    --dur-move: 280ms;   /* things that move or open */
    --dur-fade: 350ms;   /* slow fades out */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    color-scheme: dark;
  }

  /* ---------- glass material (Graph Notes, src/rendering/glass/material.css) ----------
     The element's CSS box and radius define the surface; js/glass.js draws it. Without WebGL,
     or with reduced transparency, these rules are what shows. */
  .glass-material {
    position: relative;
    isolation: isolate;
    background: var(--glass-fill);
    border: 0;
    -webkit-backdrop-filter: var(--glass-filter);
    backdrop-filter: var(--glass-filter);
  }
  [data-refracted="true"] { isolation: isolate; }
  html .glass-material[data-refracted="true"] {
    background: transparent !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  .glass-refraction {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
    border-radius: 0 !important; display: none;
  }
  [data-refracted="true"] > .glass-refraction { display: block; }
  @media (prefers-contrast: more) {
    .glass-material { background: #202023; outline: 1px solid #85858d; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }

  /* ---------- page ---------- */
  html {
    height: 100%; background: var(--bg);
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    scroll-padding-top: env(safe-area-inset-top, 0px);
    touch-action: pan-x pan-y;
  }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--t1);
    font-family: var(--font); font-size: var(--fs-m); line-height: 1.3;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  *, *::before, *::after { box-sizing: border-box; }
  img { max-width: 100%; }
  [hidden]:not([hidden=until-found i]) { display: none !important; }
  button { font: inherit; color: inherit; margin: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .app { height: 100%; display: flex; flex-direction: column; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- the music ---------- */
  .deck { position: relative; flex: 1 1 0; min-height: 0; --c1: var(--t1); --c2: var(--t2); --cf: var(--fill); }
  .stage {
    position: absolute; top: 0; bottom: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    overflow: hidden; background: var(--stage);
  }
  #roll { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #roll:active { cursor: grabbing; }
  .notation {
    position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    background: var(--stage); -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .notation::-webkit-scrollbar { display: none; }
  .glyphs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .sheet {
    max-width: 1180px; margin: 0 auto; padding: var(--under-top) 6px 46vh;
    background: var(--paper); color: var(--score-ink); min-height: 100%;
    box-shadow: 0 0 0 1px var(--paper-edge);
  }
  .sys { position: relative; width: 100%; max-width: 100%; margin-block: 2px; cursor: pointer; }
  .sys svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .sys svg g[stroke-width] { stroke: currentColor; }
  .sys svg polyline { fill: none; }
  .sys svg g.Note > .on.r { fill: var(--note-r); }
  .sys svg g.Note > .on.l { fill: var(--note-l); }
  /* hand focus: each hand's marks are one layer (see Notation.svgFor), faded as a whole so
     overlapping marks do not stack; barlines and the brace belong to both and stay */
  .sys svg [data-layer] { transition: opacity var(--dur-move) ease-out; }
  .sheet[data-hand="R"] .sys svg [data-layer="1"], .sheet[data-hand="L"] .sys svg [data-layer="0"] { opacity: var(--o-faint); }
  .barno {
    position: absolute; transform: translateY(calc(-100% - var(--sp, 7px) * 1.1));
    font: 600 calc(var(--sp, 7px) * 1.55)/1 var(--font); font-variant-numeric: tabular-nums;
    color: var(--grid-ink); pointer-events: none;
  }
  .cursor { position: absolute; width: 0; pointer-events: none; }
  .cursor::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--sp, 7px) * -1); width: calc(var(--sp, 7px) * 2);
    border-radius: 3px; background: color-mix(in srgb, var(--now) 13%, transparent);
  }
  .cursor::after { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; border-radius: 2px; background: var(--now); }
  .status {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 3;
    max-width: calc(100% - var(--gutter-l) - var(--gutter-r)); text-align: center; text-wrap: balance;
    font-size: var(--fs-l); font-weight: 500; color: var(--stage-ink);
  }

  /* ---------- scroll indicator ----------
     Thin and quiet like iOS's: it only shows while the view is moved by hand, and only then can
     it be grabbed. The hit area is far wider than the pill. It runs from below the controls to
     above the readouts, 3 px in from the edge, as on iOS. */
  .scrub {
    position: absolute; z-index: 4; top: var(--under-top); bottom: var(--above-readout); width: 0;
    right: calc(env(safe-area-inset-right, 0px) + 3px); pointer-events: none;
  }
  .scrub-thumb {
    position: absolute; top: 0; right: 0; width: 4px; height: 36px; border-radius: 4px;
    background: var(--t2); box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.35);
    opacity: 0; will-change: transform; touch-action: none;
    transition: opacity var(--dur-fade) ease-out, width var(--dur-state) var(--ease), background-color var(--dur-state) ease-out;
  }
  .scrub-thumb::before { content: ""; position: absolute; top: -10px; bottom: -10px; left: -28px; right: -4px; }
  .scrub.is-shown .scrub-thumb { opacity: 1; pointer-events: auto; cursor: grab; transition-duration: var(--dur-press), var(--dur-state), var(--dur-state); }
  .scrub.is-dragging .scrub-thumb { width: 8px; background: var(--t1); cursor: grabbing; }
  .scrub-label {
    position: absolute; top: 0; right: 24px; height: 32px; padding: 0 12px; border-radius: 16px;
    display: inline-flex; align-items: center; white-space: nowrap;
    font-size: var(--fs-s); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c1);
    box-shadow: var(--shadow-float); pointer-events: none;
  }
  .scrub-label span { position: relative; }

  /* ---------- glass over the music ---------- */
  .top {
    position: absolute; z-index: 5; top: var(--edge); left: var(--gutter-l); right: var(--gutter-r);
    display: flex; align-items: flex-start; justify-content: space-between; gap: var(--gap);
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .menu-wrap { position: relative; flex: 0 1 auto; min-width: 0; }

  .piece {
    display: flex; align-items: center; gap: var(--gap); max-width: 100%; height: var(--control); padding: 0 14px 0 16px;
    border-radius: 22px; cursor: pointer; text-align: left; color: var(--c1);
    box-shadow: var(--shadow-float);
  }
  .names { display: flex; align-items: baseline; gap: var(--gap); min-width: 0; }
  #title { flex: 0 1 auto; min-width: 0; font-size: var(--fs-l); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #composer { flex: 0 1000 auto; min-width: 0; font-size: var(--fs-s); color: var(--c2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piece > svg { width: 16px; height: 16px; flex: none; transition: transform var(--dur-move) var(--ease), opacity var(--dur-state) ease-out; }
  .piece[aria-expanded="true"] > svg { transform: rotate(180deg); }

  .menu {
    position: absolute; left: 0; top: calc(100% + var(--gap)); z-index: 20; width: var(--sheet-w);
    padding: 6px; border-radius: 22px; color: var(--c1);
    box-shadow: var(--shadow-pop);
    transform-origin: 24px 0; animation: pop var(--dur-state) var(--ease);
  }
  /* the menu stops an edge short of the bottom of the screen and scrolls inside */
  .menu-content {
    position: relative; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--edge) - var(--control) - var(--gap) - 12px - var(--edge));
  }
  .deck .glass-refraction { filter: var(--glass-calm); }
  .deck :is(.menu, .toast) > .glass-refraction { filter: var(--glass-read); }
  @keyframes pop { from { opacity: 0; transform: scale(0.94); } }
  .menu button {
    position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 1px 12px;
    width: 100%; min-height: 54px; padding: 8px 12px; border: 0; border-radius: 16px;
    background: none; color: inherit; text-align: left; cursor: pointer;
  }
  .menu button[data-pressed="true"] { background: var(--cf); }
  @media (hover: hover) { .menu button:hover { background: var(--cf); } }
  .menu button svg { grid-row: span 2; width: 20px; height: 20px; }
  .menu button b { font-weight: 600; font-size: var(--fs-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu button small { font-size: var(--fs-s); color: var(--c2); }
  .menu hr { margin: 4px 12px; border: 0; border-top: 1px solid var(--cf); }

  /* segmented control: one glass shell, the chosen segment marked by a pill that slides. Like
     every highlight here it sits 4 px inside the glass edge: each 40 px segment keeps its full
     touch area and draws its pill 2 px inside that */
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; flex: none;
    height: var(--control); padding: 2px; border-radius: 22px; color: var(--c2);
  }
  .deck .seg { box-shadow: var(--shadow-float); }
  .seg::after {
    content: ""; position: absolute; z-index: -1; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 4px) / var(--n, 2) - 4px); border-radius: 18px; background: var(--cf);
    transform: translateX(calc(var(--i, 0) * (100% + 4px))); transition: transform var(--dur-move) var(--ease);
  }
  .seg button {
    position: relative; min-width: 0; height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: none;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--gap);
    color: inherit; font-weight: 600; font-size: var(--fs-m); cursor: pointer; transition: color var(--dur-state) ease-out;
  }
  .seg button[aria-pressed="true"] { color: var(--c1); }
  .seg button svg { width: 20px; height: 20px; flex: none; }
  /* icons: always drawn in a solid colour; a dimmed icon fades as one layer (opacity on the
     svg), so where its strokes and shapes overlap they never stack into brighter spots */
  .piece > svg, .menu button svg, .seg button svg { color: var(--c1); opacity: var(--o-inactive); transition: opacity var(--dur-state) ease-out; }
  .seg button:is([aria-pressed="true"], [data-pressed="true"]) svg { opacity: 1; }
  @media (hover: hover) { .seg button:hover svg { opacity: 1; } }

  .chip {
    position: absolute; left: 50%; bottom: var(--above-readout); transform: translateX(-50%); z-index: 4;
    height: var(--control); padding: 0 16px 0 14px; border-radius: 22px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: var(--gap); font-weight: 600; font-size: var(--fs-m); color: var(--c1);
    box-shadow: var(--shadow-float); animation: rise var(--dur-move) var(--ease);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } }
  .toast {
    position: absolute; left: 50%; top: var(--under-top); transform: translateX(-50%); z-index: 6;
    width: max-content; max-width: calc(100% - var(--gutter-l) - var(--gutter-r)); padding: 12px 16px; border-radius: 22px;
    color: var(--c1); font-size: var(--fs-s); line-height: 1.45; box-shadow: var(--shadow-float);
  }
  .toast span { position: relative; }

  /* ---------- keys ---------- */
  .felt { flex: none; height: 4px; background: var(--felt); }
  .kbd-wrap {
    position: relative; flex: none; height: clamp(80px, min(21vh, 26vw), 172px);
    margin-left: env(safe-area-inset-left, 0px); margin-right: env(safe-area-inset-right, 0px);
    background: var(--bg);
  }
  #kbd { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- playback ---------- */
  .rail {
    flex: none; position: relative; --c1: var(--t1); --c2: var(--t2); --cf: var(--fill);
    display: grid; align-items: center;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: "hands steps tempo";
    padding-block: var(--edge);
    background: var(--bg); touch-action: none;
  }
  .progress {
    position: absolute; z-index: 2; bottom: var(--edge); left: var(--gutter-l); right: var(--gutter-r);
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; font-size: var(--fs-s); line-height: var(--readout); color: var(--t2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .progress > * { transition: opacity var(--dur-state) ease-out; }
  .progress > .is-obscured { opacity: var(--o-faint); transition-duration: var(--dur-press); }
  .progress b { font-weight: 600; color: var(--t1); }

  .rail-slot { position: relative; min-width: 0; }
  .hand-slot { grid-area: hands; justify-self: start; margin-left: var(--gutter-l); }
  .speed-slot { grid-area: tempo; justify-self: end; margin-right: var(--gutter-r); }
  .rail .rail-toggle { display: inline-grid; width: var(--control); height: var(--control); border-radius: 50%; }
  .rail-toggle .hand-icon { width: 28px; height: 22px; }
  .hand-icon use { stroke: none; }
  .seg .hand-icon.one { width: 13px; height: 18px; }
  .seg .hand-icon.two { width: 26px; height: 18px; }
  .hand-icon .left { fill: var(--blue); }
  .hand-icon .right { fill: var(--brass); }
  .hand-toggle[data-hand="L"] .right, .hand-toggle[data-hand="R"] .left {
    fill: var(--c1); opacity: var(--o-inactive);
  }
  .hands button { min-width: 72px; }
  .steps { grid-area: steps; display: flex; align-items: center; gap: var(--gap); }
  .round {
    width: 48px; height: 48px; padding: 0; border-radius: 50%; flex: none; cursor: pointer;
    display: inline-grid; place-items: center; color: var(--t1);
  }
  .round svg { position: relative; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .round:disabled { opacity: var(--o-dim); cursor: default; }
  .play { position: relative; width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--t1); color: var(--bg); isolation: isolate; --cf: var(--fill-ink); }
  .play svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
  .play .i-pause, .play.is-playing .i-play { display: none; }
  .play.is-playing .i-pause { display: block; }

  /* speed: the readout (tap for 100%) and a stepped slider in one glass pill. Three stops either
     side of 100% (25 to 200%), which sits in the middle with a taller tick and catches the thumb from a little
     further away. The fill runs from 100% to the thumb: how far from normal speed, and which way.
     Only the page's own colours: track --fill, fill --t2, thumb --t1, ticks --t2 (--bg on the
     fill). The ticks are solid, so they never brighten where they cross the track. The thumb is
     a plain white capsule, never glass: no glass on glass. */
  .tempo {
    display: flex; align-items: center;
    height: var(--control); padding: 2px; border-radius: 22px; color: var(--t1);
  }
  .speed-readout {
    position: relative; flex: none; width: 66px; height: 40px; padding: 0; border: 0; border-radius: 20px; background: none;
    display: grid; place-content: center; text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums;
    color: inherit; cursor: pointer;
  }
  .speed-readout output { font-size: var(--fs-m); font-weight: 600; }
  .speed-readout .bpm { font-size: var(--fs-xs); color: var(--t2); }
  .speed { --inset: 26px; position: relative; flex: 1; min-width: 0; align-self: stretch; border-radius: 20px; touch-action: none; cursor: pointer; }
  .speed:focus-visible { outline-offset: -2px; }
  .speed-track, .speed-ticks { position: absolute; left: var(--inset); right: var(--inset); top: 50%; }
  .speed-track { height: 4px; margin-top: -2px; border-radius: 2px; background: var(--fill); }
  .speed-fill {
    position: absolute; top: 0; bottom: 0; left: calc(var(--fa) * 100%); width: calc((var(--fb) - var(--fa)) * 100%);
    border-radius: inherit; background: var(--t2); transition: left var(--dur-press) var(--ease), width var(--dur-press) var(--ease);
  }
  .speed-ticks i { position: absolute; top: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--t2); }
  .speed-ticks i.on { background: var(--bg); }
  .speed-ticks i.home { width: 2px; height: 10px; margin: -5px 0 0 -1px; border-radius: 1px; }
  .speed-thumb {
    position: absolute; top: 50%; left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--f));
    width: 36px; height: 24px; margin: -12px 0 0 -18px; border-radius: 12px; pointer-events: none;
    background: var(--t1); box-shadow: var(--shadow-knob);
    transition: left var(--dur-press) var(--ease), transform var(--dur-press) ease-out;
  }
  .speed.is-dragging .speed-thumb { transform: scale(1.035); }

  /* ---------- press and hover ----------
     Pressing any control shows a highlight pill 4 px inside its glass edge and scales the whole
     shell up a little (Graph Notes' Pressable: 1.035 over 120 ms). The state comes from JS
     (data-pressed) so a quick tap is still visible. A mouse gets the same pill, fainter, on hover. */
  :is(.piece, .chip, .round, .play, .speed-readout)::after {
    content: ""; position: absolute; z-index: -1; inset: var(--pin, 4px); border-radius: 999px;
    background: var(--cf); opacity: 0; transition: opacity var(--dur-press) ease-out; pointer-events: none;
  }
  .speed-readout { --pin: 2px; }
  :is(.piece, .chip, .round, .play, .speed-readout)[data-pressed="true"]::after { opacity: 1; }
  /* a tab bar never shows a second pill: the label under the finger or pointer goes to full
     strength, and pressing moves the one pill there (js sets --i while pressed) */
  .seg button[data-pressed="true"] { color: var(--c1); }
  @media (hover: hover) {
    :is(.piece, .chip, .round:not(:disabled), .play, .speed-readout):hover::after { opacity: var(--o-inactive); }
    .seg button:hover { color: var(--c1); }
  }
  .piece, .round, .play, .seg, .tempo { transition: transform var(--dur-press) ease-out; }
  :is(.piece, .round, .play)[data-pressed="true"], :is(.seg, .tempo):has(button[data-pressed="true"]) { transform: scale(1.035); }
  .chip { transition: transform var(--dur-press) ease-out; }
  .chip[data-pressed="true"] { transform: translateX(-50%) scale(1.035); }

  .rail-shield { position: absolute; z-index: 3; inset: 0; }
  .rail > :is(.rail-slot, .steps) { transition: filter var(--dur-state) ease-out, opacity var(--dur-state) ease-out; }
  .rail[data-open] > :is(.rail-slot, .steps):not(.is-open) { filter: blur(5px); opacity: var(--o-dim); }
  .rail .rail-slot.is-open { z-index: 4; }

  .rail-slot:not(.is-open) .rail-options { display: none; }
  .rail-slot.is-open .rail-toggle { visibility: hidden; }
  .rail-options {
    position: absolute; top: 0; width: max-content; max-width: calc(100vw - var(--gutter-l) - var(--gutter-r));
    /* A mask reveals the pill without changing its buttons' hit targets. */
    mask: linear-gradient(#000, #000) left / 100% 100% no-repeat;
    animation: reveal-options var(--dur-move) var(--ease);
  }
  .hand-slot .rail-options { left: 0; }
  .speed-slot .rail-options { right: 0; mask-position: right; }
  .speed-slot .tempo.rail-options { width: var(--sheet-w); }
  /* A sheet that would leave less than twice the edge beside it fills the width instead, so it
     never sits a few pixels off-centre: 360 + 3 x 16 = 408. */
  @media (max-width: 407.98px) {
    .menu, .speed-slot .tempo.rail-options { width: calc(100vw - var(--gutter-l) - var(--gutter-r)); }
  }
  @media (max-width: 680px) {
    .hands button { min-width: 0; padding: 0 12px; }
    .steps .round { width: var(--control); height: var(--control); }
    .steps .play { width: 52px; height: 52px; }
  }
  @keyframes reveal-options {
    from { mask-size: var(--control) 100%; }
    to { mask-size: 100% 100%; }
  }
  @media (max-width: 640px) {
    #composer { display: none; }
    .views button span { display: none; }
    .views button { padding: 0 16px; }
  }
  @media (max-height: 540px) {
    .kbd-wrap { height: clamp(58px, 20vh, 104px); }
    .rail { padding-block: var(--gap); }   /* a phone on its side: the keys need the height */
    .steps .play { width: 48px; height: 48px; }
  }
  @media (max-width: 900px) and (max-height: 540px) and (orientation: landscape) {
    .kbd-wrap { height: min(16vh, 72px); }
  }
  @media (max-width: 640px) and (orientation: portrait) {
    .kbd-wrap { height: min(15vw, 78px); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app" id="app" data-view="roll">
  <div class="deck" id="deck">
    <main class="stage" id="stage">
      <canvas id="roll" aria-label="Falling notes"></canvas>
      <div class="notation" id="notation" tabindex="0" aria-label="Sheet music" hidden><div class="sheet" id="pages" data-hand="both"></div></div>
      <div class="status" id="status" role="status" hidden></div>
    </main>

    <div class="progress">
      <span id="barReadout">Bar <b id="where">1</b> <span id="whereOf"></span></span>
      <span id="clock">0:00 / 0:00</span>
    </div>

    <div class="scrub" id="scrub" aria-hidden="true">
      <div class="scrub-thumb" id="scrubThumb"></div>
      <div class="scrub-label glass-material" id="scrubLabel" hidden><span id="scrubText"></span></div>
    </div>

    <header class="top">
      <div class="menu-wrap">
        <button type="button" class="piece glass-material" id="menuBtn" aria-haspopup="true" aria-expanded="false" title="Choose a score">
          <span class="names"><span id="title">Fallboard</span><span id="composer"></span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu glass-material" id="menu" hidden>
          <div class="menu-content">
            <button type="button" id="openBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
              <b>Upload your own score</b><small>MusicXML (.musicxml, .xml, .mxl)</small>
            </button>
            <hr>
            <div id="builtinScores"></div>
          </div>
        </div>
        <template id="builtinScoreRow">
          <button type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.1 14.71V5q0-.75.74-.88l11-2Q20.9 1.93 20.9 3v13a3.9 3.9 0 1 1-1.8-3.29V4.08l-9.2 1.67V18a3.9 3.9 0 1 1-1.8-3.29ZM8.1 18a2.1 2.1 0 1 0-4.2 0 2.1 2.1 0 1 0 4.2 0ZM19.1 16a2.1 2.1 0 1 0-4.2 0 2.1 2.1 0 1 0 4.2 0Z"/></svg>
            <b></b><small></small>
          </button>
        </template>
        <input type="file" id="fileInput" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" hidden>
      </div>

      <div class="seg views glass-material" id="viewSeg" role="group" aria-label="View" style="--n:2;--i:0">
        <button type="button" data-view="roll" aria-pressed="true" aria-label="Falling notes">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3" width="4.5" height="9" rx="2"/><rect x="9.75" y="9" width="4.5" height="12" rx="2"/><rect x="16" y="5" width="4.5" height="7" rx="2"/></svg><span>Roll</span>
        </button>
        <button type="button" data-view="score" aria-pressed="false" aria-label="Sheet music">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/><ellipse cx="9.4" cy="14.6" rx="2.9" ry="2.2" transform="rotate(-22 9.4 14.6)" fill="currentColor" stroke="none"/><path d="M12 14V4.5" stroke-width="1.8"/></svg><span>Score</span>
        </button>
      </div>
    </header>

    <button type="button" class="chip glass-material" id="liveBtn" hidden><i></i>Back to playback</button>
    <div class="toast glass-material" id="toast" role="alert" hidden><span id="toastText"></span></div>
  </div>

  <div class="felt"></div>
  <div class="kbd-wrap" id="kbdWrap"><canvas id="kbd" aria-label="Piano keyboard"></canvas></div>

  <!-- one hand, drawn once: the left hand as is, the right hand mirrored -->
  <svg class="vh" aria-hidden="true"><defs><path id="fb-hand" d="M5.4 12.3V5.9a1.05 1.05 0 0 1 2.1 0v4.4h.7V4.4a1.05 1.05 0 0 1 2.1 0v5.9h.7V5.2a1.05 1.05 0 0 1 2.1 0v5.1h.7V7.1a1.05 1.05 0 0 1 2.1 0v6.8c0 4.2-2.2 6.8-5.8 6.8h-.5c-2.4 0-4.1-1.2-5.4-3.4l-2.3-4.1a1.2 1.2 0 0 1 1.9-1.4l1.6 1.7z"/></defs></svg>

  <footer class="rail" id="rail">
    <div class="rail-slot hand-slot" id="handSlot" hidden>
      <button type="button" class="round rail-toggle hand-toggle glass-material" id="handToggle" aria-label="Hands: Both" aria-controls="handSeg" aria-expanded="false">
        <svg class="hand-icon" viewBox="0 0 34 24" aria-hidden="true"><use class="left" href="#fb-hand"/><use class="right" href="#fb-hand" transform="translate(34 0) scale(-1 1)"/></svg>
      </button>
      <div class="seg hands rail-options glass-material" id="handSeg" role="group" aria-label="Hands" style="--n:3;--i:1">
        <button type="button" data-hand="L" aria-pressed="false"><svg class="hand-icon one" viewBox="0 0 17 24" aria-hidden="true"><use class="left" href="#fb-hand"/></svg>Left</button>
        <button type="button" data-hand="both" aria-pressed="true"><svg class="hand-icon two" viewBox="0 0 34 24" aria-hidden="true"><use class="left" href="#fb-hand"/><use class="right" href="#fb-hand" transform="translate(34 0) scale(-1 1)"/></svg>Both</button>
        <button type="button" data-hand="R" aria-pressed="false"><svg class="hand-icon one" viewBox="17 0 17 24" aria-hidden="true"><use class="right" href="#fb-hand" transform="translate(34 0) scale(-1 1)"/></svg>Right</button>
      </div>
    </div>

    <div class="steps" id="steps">
      <button type="button" class="round glass-material" id="prevBtn" aria-label="Previous note" title="Previous note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11.5 6.5 6 12l5.5 5.5"/></svg></button>
      <button type="button" class="round play" id="playBtn" aria-label="Play">
        <!-- equilateral, its centroid (one third in from the flat side) on the circle's centre; the round stroke softens the corners without moving it -->
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.54 6 L18.93 12 L8.54 18 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.3"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.3"/></svg>
      </button>
      <button type="button" class="round glass-material" id="nextBtn" aria-label="Next note" title="Next note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12.5 6.5 18 12l-5.5 5.5"/></svg></button>
    </div>

    <div class="rail-slot speed-slot" id="speedSlot">
      <button type="button" class="round rail-toggle glass-material" id="speedToggle" aria-label="Playback speed: 100%" aria-controls="tempoBox" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17a8 8 0 1 1 14 0M12 14l3.4-4.1"/><circle cx="12" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="tempo rail-options glass-material" id="tempoBox" role="group" aria-label="Playback speed">
        <button type="button" class="speed-readout" id="speedReset" title="Back to 100%">
          <output id="speedOut">100%</output>
          <span class="bpm"><span id="tempo">60</span> bpm</span>
        </button>
        <div class="speed" id="speed" role="slider" tabindex="0" aria-label="Playback speed" aria-valuemin="25" aria-valuemax="200" aria-valuenow="100" aria-valuetext="100%" style="--f:0.5;--fa:0.5;--fb:0.5">
          <div class="speed-track" id="speedTrack"><div class="speed-fill"></div></div>
          <div class="speed-ticks" id="speedTicks"></div>
          <div class="speed-thumb" id="speedThumb"></div>
        </div>
      </div>
    </div>
    <div class="rail-shield" id="railShield" aria-hidden="true" hidden></div>
  </footer>
</div>

<script src="js/score.js"></script>
<script src="js/audio.js"></script>
<script src="js/glass.js"></script>
<script src="js/engrave-core.js"></script>
<script src="js/notation.js"></script>
<script src="js/app.js"></script>

</body></html>
