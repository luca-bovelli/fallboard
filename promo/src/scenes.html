<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fallboard Motion Graphics Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@1,6..72,500..600&display=swap">
<style>
  /* Exact Fallboard tokens from dist/index.html */
  :root {
    --bg: #000000;
    --t1: #f5f5f7;
    --t2: rgba(245, 245, 247, 0.78);
    --c1: var(--t1);
    --c2: rgba(245, 245, 247, 0.72);
    --fill: rgb(255 255 255 / 0.18);
    --fill-ink: rgb(0 0 0 / 0.15);
    --cf: var(--fill);
    --now: #ff566a;
    --lane: #121317;
    --glass-fill: rgb(76 76 76 / 42%);
    --glass-filter: blur(8px) saturate(150%) brightness(1.08);
    --glass-lighting-brightness: 1.08;
    --shadow-float: 0 12px 40px rgb(0 0 0 / 0.42);
    --o-inactive: 0.72;
    --control: 44px;
    --gap: 8px;
    --fs-m: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
    --serif-em: "Newsreader", Georgia, serif;
    color-scheme: dark;
  }

  /* Exact Fallboard glass material & segmented control rules from dist/index.html */
  .glass-material {
    position: relative;
    isolation: isolate;
    background: var(--glass-fill);
    border: 0;
    -webkit-backdrop-filter: var(--glass-filter);
    backdrop-filter: var(--glass-filter);
  }
  [data-refracted="true"] { isolation: isolate; }
  html .glass-material[data-refracted="true"] {
    background: transparent !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  .glass-refraction {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
    border-radius: 0 !important; display: none;
  }
  [data-refracted="true"] > .glass-refraction { display: block; }
  .scene .glass-refraction { filter: contrast(0.88) brightness(0.84); }

  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; flex: none;
    height: var(--control); padding: 2px; border-radius: 22px; color: var(--c2);
    box-shadow: var(--shadow-float);
  }
  .seg::after {
    content: ""; position: absolute; z-index: -1; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 4px) / var(--n, 2) - 4px); border-radius: 18px; background: var(--cf);
    transform: translateX(calc(var(--i, 0) * (100% + 4px)));
  }
  .seg button {
    position: relative; min-width: 0; height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: none;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--gap);
    color: inherit; font: inherit; font-weight: 600; font-size: var(--fs-m); cursor: default;
  }
  .seg button[aria-pressed="true"] { color: var(--c1); }
  .seg button svg { width: 20px; height: 20px; flex: none; color: var(--c1); opacity: var(--o-inactive); }
  .seg button[aria-pressed="true"] svg { opacity: 1; }

  em.hi {
    font-family: var(--serif-em);
    font-style: italic;
    font-weight: 500;
    font-variation-settings: "opsz" 60;
    font-size: 1.08em;
    letter-spacing: -0.01em;
    color: var(--hi, #bafff0);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000; color: var(--t1); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: fixed; inset: 0; display: none; overflow: hidden; background: #000;
  }
  .scene.active { display: block; }
  .scene-bg {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0;
    transform-origin: center 72%;
  }
  .blackout {
    position: absolute; inset: 0; background: #000; z-index: 60; opacity: 0; pointer-events: none;
  }

  /* ==================== SCENE: PURIST UNO REVERSE (REAL CONTINUE-CARD MESH + GLASS.JS) ==================== */
  .purist-center {
    position: relative; z-index: 2; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 9vw; gap: 30px;
    transform-origin: center center;
  }
  body.vertical .purist-center { gap: 24px; padding: 0 7vw; }
  .purist-quote {
    font-family: var(--font); font-weight: 700;
    font-size: 48px; line-height: 1.14; letter-spacing: -0.035em;
    color: var(--t1); max-width: 800px; text-wrap: balance;
    text-shadow: 0 6px 36px rgba(5, 30, 62, 0.55);
  }
  body.vertical .purist-quote { font-size: 26px; line-height: 1.18; max-width: 304px; }
  .purist-seg-wrap { display: inline-flex; justify-content: center; }

  /* ==================== SCENE: ENDCARD (CLEAN, ZERO PILL CLUTTER, LIVING WEBGL NOTES) ==================== */
  .end-center {
    position: relative; z-index: 2; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 8vw;
    transform-origin: center center;
  }
  .end-icon {
    width: 104px; height: 104px;
    filter: drop-shadow(0 20px 52px rgba(24, 6, 48, 0.58));
    margin-bottom: 24px;
  }
  body.vertical .end-icon { width: 88px; height: 88px; margin-bottom: 20px; }
  .end-icon img { width: 100%; height: 100%; display: block; }
  .end-title {
    font-family: var(--font); font-weight: 700;
    font-size: 62px; letter-spacing: -0.04em; line-height: 1;
    color: #fff; margin-bottom: 14px;
    text-shadow: 0 6px 32px rgba(24, 6, 48, 0.45);
  }
  body.vertical .end-title { font-size: 42px; margin-bottom: 12px; }
  .end-sub {
    font-size: 18px; color: rgba(255, 245, 252, 0.86); font-weight: 500;
    line-height: 1.35; letter-spacing: -0.01em;
    text-shadow: 0 2px 18px rgba(24, 6, 48, 0.45);
  }
  body.vertical .end-sub { font-size: 14px; }
</style>
</head>
<body>

<!-- ==================== SCENE: PURIST UNO REVERSE ==================== -->
<section class="scene" id="scene-hook-purist">
  <canvas class="scene-bg" id="puristBg"></canvas>
  <div class="purist-center" id="puristStage">
    <h1 class="purist-quote" id="puristQuote">
      “Falling notes are for people who <em class="hi" style="--hi:#bafff0">can’t read</em> sheet music.”
    </h1>
    <div class="purist-seg-wrap" id="puristSegWrap">
      <div class="seg views glass-material" id="puristSeg" role="group" aria-label="View" style="--n:2;--i:0">
        <button type="button" id="puristRoll" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.45" y="3" width="4.5" height="9" rx="2"/><rect x="9.75" y="9" width="4.5" height="12" rx="2"/><rect x="16.05" y="5" width="4.5" height="7" rx="2"/></svg><span>Roll</span>
        </button>
        <button type="button" id="puristScore" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><defs><mask id="fb-staff-gap-p" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><ellipse cx="9.4" cy="15.85" rx="2.9" ry="2.2" transform="rotate(-22 9.4 15.85)" fill="#000" stroke="#000" stroke-width="3.6"/><path d="M11.31 15.4V5.75" stroke="#000" stroke-width="5.4"/></mask></defs><path d="M3 8.25h18M3 13.25h18M3 18.25h18" mask="url(#fb-staff-gap-p)"/><ellipse cx="9.4" cy="15.85" rx="2.9" ry="2.2" transform="rotate(-22 9.4 15.85)" fill="currentColor" stroke="none"/><path d="M11.31 15.4V5.75"/></svg><span>Score</span>
        </button>
      </div>
    </div>
  </div>
  <div class="blackout" id="puristBlack"></div>
</section>

<!-- ==================== SCENE: ENDCARD ==================== -->
<section class="scene" id="scene-endcard">
  <canvas class="scene-bg" id="endBg"></canvas>
  <div class="end-center" id="endStage">
    <div class="end-icon" id="endIcon"><img src="/icons/icon-512.png" alt="Fallboard"></div>
    <h1 class="end-title" id="endTitle">Fallboard</h1>
    <p class="end-sub" id="endSub">Free · No account · Works offline</p>
  </div>
  <div class="blackout" id="endBlack"></div>
</section>

<!-- Fallboard's ACTUAL score parser, WebGL2 Continue-card renderer (roll-gl.js), and refractive glass (glass.js) -->
<script src="/js/score.js"></script>
<script src="/js/roll-gl.js"></script>
<script src="/js/glass.js"></script>
<script>
(function () {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const $ = (id) => document.getElementById(id);

  // Snappy Apple-style cubic-bezier(0.22, 1, 0.36, 1) ease-out & cubic-bezier(0.32, 0, 0.67, 0) ease-in
  function bezier(x, x1, y1, x2, y2) {
    x = clamp(x, 0, 1);
    if (x <= 0 || x >= 1) return x;
    const bx = (u) => 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
    const by = (u) => 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    let lo = 0, hi = 1;
    for (let i = 0; i < 16; i++) { const m = (lo + hi) * 0.5; if (bx(m) < x) lo = m; else hi = m; }
    return by((lo + hi) * 0.5);
  }
  const easeOut = (x) => bezier(x, 0.18, 0.9, 0.25, 1.0);
  const easeFallboard = (x) => bezier(x, 0.32, 0.72, 0.0, 1.0);
  const easeIn = (x) => bezier(x, 0.55, 0.0, 0.9, 0.35);

  /* Exact Fallboard cover palettes from dist/js/library.js */
  const COVER_PALETTES = {
    orchid: {
      base: '#4d1499',
      fields: [
        { c: '#9b38f2', x: 84, y: 18, w: 92, h: 86, stop: 10 },
        { c: '#ff6fb2', x: 18, y: 24, w: 88, h: 78, stop: 8 },
        { c: '#ffd0ea', x: 10, y: 8,  w: 62, h: 52, stop: 0 },
        { c: '#5a1aa8', x: 58, y: 86, w: 96, h: 80, stop: 14 },
      ],
      hands: ['#ff9ad0', '#a557ff'],
    },
    lagoon: {
      base: '#05396b',
      fields: [
        { c: '#0a6bd8', x: 22, y: 28, w: 90, h: 82, stop: 12 },
        { c: '#1fd3c3', x: 82, y: 72, w: 88, h: 80, stop: 8 },
        { c: '#bafff0', x: 92, y: 90, w: 58, h: 48, stop: 0 },
        { c: '#063e7a', x: 52, y: 14, w: 95, h: 76, stop: 14 },
      ],
      hands: ['#6ff0dc', '#3a86ff'],
    },
  };

  let balladeScore = null, denseT0 = 47.0;
  function sliceRoll(sc, t0, dur = 8.0) {
    const notes = [];
    for (const n of sc.notes) {
      if (n.t1 < t0 - 0.02 || n.t0 >= t0 + dur) continue;
      const start = Math.max(0, Math.round((n.t0 - t0) * 100));
      const end = Math.round((Math.min(n.t1, t0 + dur) - Math.max(n.t0, t0)) * 100);
      if (end < 3) continue;
      notes.push(start, Math.max(5, end), n.midi, n.hand);
      if (notes.length >= 360 * 4) break;
    }
    return { end: Math.round(dur * 100), notes };
  }
  window.initPromoData = async () => {
    if (balladeScore) return;
    const xml = await (await fetch('/scores/ballade-op23.musicxml')).text();
    balladeScore = await FB.parseScore(xml);
    let bestT = 47.0, bestScore = 0;
    for (const ot of balladeScore.onsets.both) {
      if (ot < 10 || ot > 260) continue;
      const chord = balladeScore.notes.filter((n) => Math.abs(n.t0 - ot) < 0.03);
      if (chord.length < 4) continue;
      const hands = new Set(chord.map((n) => n.hand)).size;
      const avgChordDur = chord.reduce((s, n) => s + (n.t1 - n.t0), 0) / chord.length;
      const follow = balladeScore.notes.filter((n) => n.t0 > ot && n.t0 < ot + 6.0);
      const avgFollowDur = follow.length ? follow.reduce((s, n) => s + (n.t1 - n.t0), 0) / follow.length : 0;
      if (avgChordDur < 0.35 || avgFollowDur < 0.28 || follow.length > 55) continue;
      const scVal = chord.length * 14 + (hands > 1 ? 20 : 0) + Math.min(25, avgChordDur * 18) + Math.min(25, avgFollowDur * 25);
      if (scVal > bestScore) { bestScore = scVal; bestT = ot; }
    }
    denseT0 = bestT;
  };

  /* Locked WebGL2 2-pass linear-light quadratic progressive blur + asymmetric C∞ OKLCH fade + ±0.5 LSB IGN dithering */
  const oklchFade = (() => {
    const glc = document.createElement('canvas');
    const gl = glc.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
    if (!gl) return null;
    const vs = `#version 300 es
      void main() {
        vec2 p = vec2((gl_VertexID & 1) * 2 - 1, (gl_VertexID >> 1) * 2 - 1);
        gl_Position = vec4(p, 0.0, 1.0);
      }`;
    const fs = `#version 300 es
      precision highp float;
      uniform sampler2D uTex;
      uniform vec2 uSize, uDir;
      uniform vec4 uEll;
      uniform vec2 uAsym;
      uniform float uMostBlur, uDoFade;
      out vec4 o;
      vec3 dec(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
      vec3 enc(vec3 c) { return mix(c * 12.92, 1.055 * pow(max(c, 0.0), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
      float asymKeep(float d, float a, float b) {
        if (d <= 0.0) return 1.0;
        if (d >= 1.0) return 0.0;
        return 1.0 / (1.0 + exp(a / (1.0 - d) - b / d));
      }
      vec3 rgbToOklab(vec3 c) {
        float l = 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b;
        float m = 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b;
        float s = 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b;
        float l_ = pow(max(l, 0.0), 1.0 / 3.0);
        float m_ = pow(max(m, 0.0), 1.0 / 3.0);
        float s_ = pow(max(s, 0.0), 1.0 / 3.0);
        return vec3(
          0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
          1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
          0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
        );
      }
      vec3 oklabToRgb(vec3 c) {
        float l_ = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
        float m_ = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
        float s_ = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
        float l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
        return vec3(
          +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
        );
      }
      float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }

      void main() {
        vec2 fc = gl_FragCoord.xy;
        vec2 uv = vec2(fc.x / uSize.x, 1.0 - fc.y / uSize.y);
        float d = clamp(length((uv - uEll.xy) / uEll.zw), 0.0, 1.0);
        float keep = asymKeep(d, uAsym.x, uAsym.y);
        float fadeOut = 1.0 - keep;

        if (uDoFade > 0.5 && keep <= 0.00001) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }

        float sigma = uMostBlur * fadeOut * fadeOut;
        vec3 lin;
        if (sigma < 0.35) {
          lin = dec(texture(uTex, fc / uSize).rgb);
        } else {
          vec3 acc = vec3(0.0); float sum = 0.0;
          for (int i = -12; i <= 12; i++) {
            float x = float(i) * sigma * 0.25;
            float wgt = exp(-0.5 * float(i * i) / 18.0);
            vec2 suv = clamp((fc + uDir * x) / uSize, vec2(0.0), vec2(1.0));
            acc += dec(texture(uTex, suv).rgb) * wgt;
            sum += wgt;
          }
          lin = acc / sum;
        }

        if (uDoFade > 0.5) {
          vec3 lab = rgbToOklab(lin);
          float L = lab.x * keep;
          float cScale = keep * (1.0 + 0.45 * (1.0 - keep));
          lin = oklabToRgb(vec3(L, lab.y * cScale, lab.z * cScale));
          float mn = min(min(lin.r, lin.g), lin.b);
          if (mn < 0.0) {
            float lum = max(0.0001, 0.2126 * lin.r + 0.7152 * lin.g + 0.0722 * lin.b);
            float t = lum / (lum - mn);
            lin = mix(vec3(lum), lin, t);
          }
          vec3 srgb = enc(clamp(lin, 0.0, 1.0));
          float dither = (ign(fc) + ign(fc + vec2(17.0, 31.0)) - 1.0) / 255.0;
          o = vec4(clamp(srgb + dither, 0.0, 1.0), 1.0);
          return;
        }
        o = vec4(enc(clamp(lin, 0.0, 1.0)), 1.0);
      }`;
    const comp = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; };
    const prog = gl.createProgram();
    gl.attachShader(prog, comp(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, comp(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    const u = {};
    for (const k of ['uTex', 'uSize', 'uDir', 'uEll', 'uAsym', 'uMostBlur', 'uDoFade']) u[k] = gl.getUniformLocation(prog, k);
    const mkTex = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    };
    const tIn = mkTex(), tMid = mkTex(), fbo = gl.createFramebuffer(), vao = gl.createVertexArray();
    return function apply(srcCanvas, cx, cy, rx, ry, a, b, mostBlurPx) {
      const cw = srcCanvas.width, ch = srcCanvas.height;
      if (glc.width !== cw || glc.height !== ch) {
        glc.width = cw; glc.height = ch;
        gl.bindTexture(gl.TEXTURE_2D, tMid);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cw, ch, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      }
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tIn);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
      gl.useProgram(prog); gl.bindVertexArray(vao); gl.viewport(0, 0, cw, ch);
      gl.uniform1i(u.uTex, 0); gl.uniform2f(u.uSize, cw, ch);
      gl.uniform4f(u.uEll, cx, cy, rx, ry); gl.uniform2f(u.uAsym, a, b);
      gl.uniform1f(u.uMostBlur, mostBlurPx);

      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tMid, 0);
      gl.bindTexture(gl.TEXTURE_2D, tIn);
      gl.uniform2f(u.uDir, 1, 0); gl.uniform1f(u.uDoFade, 0.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.bindTexture(gl.TEXTURE_2D, tMid);
      gl.uniform2f(u.uDir, 0, 1); gl.uniform1f(u.uDoFade, 1.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindVertexArray(null);
      return glc;
    };
  })();

  /* Live-animated real FB.rollGL.thumb Continue-card renderer:
     Every frame shifts the slice window smoothly forward so the real Chopin notes gently fall & breathe! */
  let tmpCanvas = null;
  const spanCache = new Map();
  function renderLivingBackdrop(canvasId, paletteKey, rollOffsetSec, opts = {}) {
    const c = $(canvasId);
    const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
    const vert = w < h;
    const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    const pal = COVER_PALETTES[paletteKey] || COVER_PALETTES.orchid;

    const optScale = vert ? 0.62 : 0.48;
    const lw = Math.round(w * optScale);
    const lh = Math.round(h * optScale);
    const effDpr = cw / lw;

    // Lock keyboard span to the initial chord window so notes never jitter horizontally while falling!
    const spanKey = `${vert ? 'v' : 'h'}`;
    let span = spanCache.get(spanKey);
    if (!span) {
      const refRoll = sliceRoll(balladeScore, denseT0, 8.0);
      const notes = refRoll.notes;
      let lo = 127, hi = 0;
      for (let i = 0; i < notes.length; i += 4) { lo = Math.min(lo, notes[i + 2]); hi = Math.max(hi, notes[i + 2]); }
      const whiteOf = (m) => { let n = 0; for (let k = 21; k < m; k++) if (!FB.isBlack(k)) n++; return n; };
      const wLo = whiteOf(lo), wHi = whiteOf(hi) + 1;
      const wSpan = Math.max(12, wHi - wLo);
      const wMid = (wLo + wHi) * 0.5;
      const mult = vert ? 1.85 : 2.35;
      const totalW = wSpan * mult;
      span = [wMid - totalW * 0.5, wMid + totalW * 0.5];
      spanCache.set(spanKey, span);
    }

    const roll = sliceRoll(balladeScore, denseT0 + rollOffsetSec, 8.0);
    if (!tmpCanvas) {
      tmpCanvas = document.createElement('canvas');
      tmpCanvas.style.cssText = 'position:fixed;left:-9999px;top:0;pointer-events:none;';
      document.body.appendChild(tmpCanvas);
    }
    tmpCanvas.style.width = lw + 'px';
    tmpCanvas.style.height = lh + 'px';

    FB.rollGL.thumb(tmpCanvas, {
      roll,
      hands: pal.hands,
      cover: { base: pal.base, fields: pal.fields },
      span,
      glass: false,
      dpr: effDpr,
    });

    const cx = 0.5;
    const cy = opts.cy ?? 1.12;
    const rx = opts.rx ?? (vert ? 1.35 : 1.24);
    const ry = opts.ry ?? (vert ? 1.04 : 1.06);
    const a = opts.a ?? 0.65;
    const b = opts.b ?? 0.45;
    const mostBlur = (opts.blur ?? 10) * dpr;
    const faded = oklchFade ? oklchFade(tmpCanvas, cx, cy, rx, ry, a, b, mostBlur) : tmpCanvas;

    if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(faded, 0, 0, cw, ch);
    return c;
  }

  let glassPurist = null, vCounter = 1;
  function ensureGlass() {
    if (!glassPurist && window.FBGlass) {
      const root = $('scene-hook-purist');
      glassPurist = new FBGlass.GlassBackdrop({ root: () => root, reducedTransparency: () => false });
      FBGlass.attachGlassMaterials(glassPurist, root);
    }
  }

  function setActive(id) {
    document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('active', s.id === 'scene-' + id));
  }

  window.configureLayout = (vertical) => {
    document.body.classList.toggle('vertical', !!vertical);
    spanCache.clear();
  };

  window.renderScene = (sceneId, t, opts = {}) => {
    setActive(sceneId);
    const W = window.innerWidth, H = window.innerHeight;
    const vert = document.body.classList.contains('vertical');

    if (sceneId === 'hook-purist') {
      // 3.2s total: snappy arrival, tactile glass pill flip at 1.65s, anticipated zoom-push exit into app-02!
      ensureGlass();
      const bg = renderLivingBackdrop('puristBg', 'lagoon', t * 0.42, {
        cy: 1.12, rx: vert ? 1.38 : 1.26, ry: vert ? 1.08 : 1.10,
        a: 0.65, b: 0.45, blur: 10,
      });

      const qIn = easeOut(seg(t, 0.04, 0.44));
      $('puristQuote').style.opacity = qIn;
      $('puristQuote').style.transform = `translateY(${lerp(22, 0, qIn)}px) scale(${lerp(0.97, 1, qIn)})`;

      const segIn = easeOut(seg(t, 0.72, 1.12));
      $('puristSegWrap').style.opacity = segIn;
      $('puristSegWrap').style.transform = `translateY(${lerp(18, 0, segIn)}px) scale(${lerp(0.94, 1, segIn)})`;

      const slide = easeFallboard(seg(t, 1.65, 2.08));
      $('puristSeg').style.setProperty('--i', slide.toFixed(4));
      $('puristRoll').setAttribute('aria-pressed', slide < 0.5 ? 'true' : 'false');
      $('puristScore').setAttribute('aria-pressed', slide >= 0.5 ? 'true' : 'false');

      // Anticipated camera push-in during the final 0.34s so the handoff into app-02 feels continuous!
      const exitPush = easeIn(seg(t, 2.86, 3.20));
      const stageScale = lerp(1.0, 1.13, exitPush);
      $('puristStage').style.transform = `scale(${stageScale.toFixed(4)})`;
      $('puristStage').style.opacity = (1 - exitPush * 0.35).toFixed(4);
      $('puristBg').style.transform = `scale(${lerp(1.0, 1.08, exitPush).toFixed(4)})`;
      $('puristBlack').style.opacity = '0';

      if (glassPurist) {
        glassPurist.update(W, H, t * 1000, (ctx) => ctx.drawImage(bg, 0, 0, W, H), String(++vCounter));
      }
    }

    else if (sceneId === 'endcard') {
      // 2.6s total: silky decelerating settle from previous clip, living falling notes, snappy icon/title/sub, clean finish!
      renderLivingBackdrop('endBg', opts.palette || 'orchid', t * 0.35, {
        cy: 1.12, rx: vert ? 1.35 : 1.24, ry: vert ? 1.04 : 1.06,
        a: 0.65, b: 0.45, blur: 10,
      });

      const enterSettle = easeOut(seg(t, 0.0, 0.42));
      const drift = lerp(0.97, 1.015, seg(t, 0.0, 2.60));
      const bgScale = lerp(1.09, 1.0, enterSettle) * lerp(1.0, 1.025, seg(t, 0.42, 2.60));
      $('endBg').style.transform = `scale(${bgScale.toFixed(4)})`;
      $('endStage').style.transform = `scale(${drift.toFixed(4)})`;

      const iIn = easeOut(seg(t, 0.06, 0.44));
      $('endIcon').style.opacity = iIn;
      $('endIcon').style.transform = `scale(${lerp(0.84, 1, iIn)}) translateY(${lerp(16, 0, iIn)}px)`;

      const tIn = easeOut(seg(t, 0.16, 0.54));
      $('endTitle').style.opacity = tIn;
      $('endTitle').style.transform = `translateY(${lerp(16, 0, tIn)}px)`;

      const sIn = easeOut(seg(t, 0.28, 0.66));
      $('endSub').style.opacity = sIn;
      $('endSub').style.transform = `translateY(${lerp(12, 0, sIn)}px)`;

      // Clean, subtle end fade only in the final 0.28s
      $('endBlack').style.opacity = easeIn(seg(t, 2.32, 2.60));
    }
  };
})();
</script>
</body>
</html>
