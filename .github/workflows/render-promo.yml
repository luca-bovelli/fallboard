# Manual cloud render for Fallboard promo videos, modular building blocks, and preview stills.
# Parallel Ubuntu 24.04 runners capture 60fps live WebGL2 app clips + exact note/UI event logs,
# render 100% frame-synced Yamaha C5 piano & UI audio stems, bake synced audio into every modular
# building block, and assemble all 5 final 60fps 1080p MP4 exports with matched-motion transitions.
name: Render Promo Videos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to render'
        type: choice
        default: all
        options:
          - all
          - previews-only

jobs:
  previews:
    if: ${{ inputs.mode == 'previews-only' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render high-res preview stills (16:9 & 9:16)
        run: node promo/scripts/render-scenes.js --preview-only
      - uses: actions/upload-artifact@v4
        with:
          name: promo-previews
          path: promo/_preview/*.jpg

  scenes:
    if: ${{ inputs.mode == 'all' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        format: ['16x9', '9x16']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install FFmpeg & Playwright Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render 60fps motion-graphic scenes (${{ matrix.format }})
        run: node promo/scripts/render-scenes.js --format=${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-clips-${{ matrix.format }}-scenes
          path: promo/clips/${{ matrix.format }}/*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: part-previews-scenes-${{ matrix.format }}
          path: promo/_preview/${{ matrix.format }}-*.jpg
          if-no-files-found: ignore

  app-captures:
    if: ${{ inputs.mode == 'all' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        format: ['16x9', '9x16']
        clip:
          - app-01-open-and-step.mp4
          - app-02-roll-to-score.mp4
          - app-03-color-worlds.mp4
          - app-04-library-henle-pdf.mp4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install FFmpeg & Playwright Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Capture 60fps live Fallboard app (${{ matrix.format }} / ${{ matrix.clip }})
        run: node promo/scripts/capture-app.js --force --format=${{ matrix.format }} --only=${{ matrix.clip }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-clips-${{ matrix.format }}-${{ matrix.clip }}
          path: promo/clips/${{ matrix.format }}/${{ matrix.clip }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-events-${{ matrix.format }}-${{ matrix.clip }}
          path: promo/clips/${{ matrix.format }}/*.events.json
      - uses: actions/upload-artifact@v4
        with:
          name: part-previews-app-${{ matrix.format }}-${{ matrix.clip }}
          path: promo/_preview/${{ matrix.format }}-*.jpg
          if-no-files-found: ignore

  audio:
    if: ${{ inputs.mode == 'all' }}
    needs: [app-captures]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: part-events-16x9-*
          merge-multiple: true
          path: promo/clips/16x9
      - name: Render 100% frame-synced Yamaha C5 piano & UI audio stems
        run: node promo/scripts/make-audio.js
      - uses: actions/upload-artifact@v4
        with:
          name: part-audio
          path: promo/audio/*.wav

  assemble:
    if: ${{ inputs.mode == 'all' }}
    needs: [audio, scenes, app-captures]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: part-audio
          path: promo/audio
      - uses: actions/download-artifact@v4
        with:
          pattern: part-clips-16x9-*
          merge-multiple: true
          path: promo/clips/16x9
      - uses: actions/download-artifact@v4
        with:
          pattern: part-clips-9x16-*
          merge-multiple: true
          path: promo/clips/9x16
      - uses: actions/download-artifact@v4
        with:
          pattern: part-previews-*
          merge-multiple: true
          path: promo/_preview
      - name: Bake synced building blocks & assemble all 5 final 60fps 1080p MP4 exports
        run: |
          node promo/scripts/assemble.js
          for f in promo/exports/*.mp4; do
            echo "=== $f ($(du -h "$f" | cut -f1)) ==="
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of compact=p=0 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: promo-exports
          path: promo/exports/*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: promo-building-blocks
          path: |
            promo/clips/16x9/*.mp4
            promo/clips/9x16/*.mp4
            promo/audio/*.wav
            promo/_preview/*.jpg
