# On every push to main: engrave any new or changed scores (committing the results back), then
# publish dist/ to GitHub Pages. Pages must be switched on once in the repository settings:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Engrave and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Engrave new or changed scores
        run: npm run engrave

      - name: Commit the engravings
        run: |
          if [ -n "$(git status --porcelain -- dist/scores)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/scores
            git commit -m "Engrave scores"
            git pull --rebase
            git push
          fi

      - name: Stamp the deploy copy with this version
        run: node tools/stamp.js "$(git rev-parse --short=10 HEAD)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
