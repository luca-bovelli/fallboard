# On every push and pull request: the checks, here rather than on a local machine. Every script
# must parse, the browser's search must match its sources, the search queries must find their
# pieces, and the app must run in a real browser without errors (tools/smoke.js: Chromium, then
# WebKit at a phone's size), whose screenshots are kept with the run (Actions > the run >
# Artifacts > screenshots).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # a named release: ubuntu-latest moves to 26.04, which this Playwright doesn't know
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Every script parses
        run: |
          for f in dist/js/*.js dev-server.js $(git ls-files 'tools/*.js' 'tools/**/*.js'); do
            node --check "$f" || { echo "does not parse: $f"; exit 1; }
          done

      - name: The browser's search matches its sources
        run: node tools/catalog/build-search.js --check

      - name: Search queries find their pieces
        run: npm run catalog:test

      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: The app runs in a browser without errors
        run: node tools/smoke.js

      # Safari's engine apart, so that trouble installing it never hides the test above
      - name: Install WebKit
        id: webkit
        if: always()
        run: npx playwright install --with-deps webkit

      - name: And in Safari's engine, at a phone's size
        if: always() && steps.webkit.outcome == 'success'
        run: node tools/smoke.js webkit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .data/smoke
          if-no-files-found: ignore
